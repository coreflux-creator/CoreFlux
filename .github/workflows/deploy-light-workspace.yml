name: Deploy light workspace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreflux-cloudways-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Package light workspace release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ENTRY_ASSETS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' index.html | sort -u)
          test "${#ENTRY_ASSETS[@]}" -gt 0

          BUILT_ASSETS=()
          declare -A SEEN_ASSETS=()
          for asset in "${ENTRY_ASSETS[@]}"; do
            if [ -z "${SEEN_ASSETS[$asset]:-}" ]; then
              SEEN_ASSETS[$asset]=1
              BUILT_ASSETS+=("$asset")
            fi
          done
          for ((index = 0; index < ${#BUILT_ASSETS[@]}; index++)); do
            asset="${BUILT_ASSETS[$index]}"
            test -f "spa-assets/$asset"
            if [[ "$asset" == *.js ]]; then
              mapfile -t IMPORTS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' "spa-assets/$asset" | sort -u || true)
              for imported in "${IMPORTS[@]}"; do
                if [ -z "${SEEN_ASSETS[$imported]:-}" ]; then
                  SEEN_ASSETS[$imported]=1
                  BUILT_ASSETS+=("$imported")
                fi
              done
            fi
          done

          ROOT_ASSETS=()
          for asset in "${BUILT_ASSETS[@]}"; do
            test -f "spa-assets/$asset"
            ROOT_ASSETS+=("spa-assets/$asset")
          done

          tar -czf coreflux-light-workspace-release.tar.gz \
            .deploy-version \
            .htaccess \
            about.html \
            accounting.html \
            admin/index.html \
            api/admin/integrations_health.php \
            api/ai/exceptions.php \
            api/ai_accuracy.php \
            api/ap/approve_by_email.php \
            api/books_health.php \
            api/gusto_oauth_callback.php \
            api/mail_connections.php \
            api/staffing/approve_timesheet_by_email.php \
            approvers/signup.html \
            assets/css/signup.html \
            assets/css/styles.css \
            auditor.php \
            core/api_bootstrap.php \
            core/modules.php \
            core/rbac/legacy_map.php \
            core/storage_register.php \
            core/mail/M365GraphDriver.php \
            core/views/admin/tenant_edit.php \
            crm.html \
            dashboard/dist \
            dashboard/src/App.jsx \
            dashboard/src/lib/api.js \
            dashboard/src/components/ComparisonTable.jsx \
            dashboard/src/components/MetricCard.jsx \
            dashboard/src/components/ModuleTabs.jsx \
            dashboard/src/components/ReportShell.jsx \
            dashboard/src/layout/AppLayout.jsx \
            dashboard/src/layout/Header.jsx \
            dashboard/src/layout/Sidebar.jsx \
            dashboard/src/pages/MasterTenantsAdmin.jsx \
            dashboard/src/pages/DashboardOverview.jsx \
            dashboard/src/pages/GraphqlSandbox.jsx \
            dashboard/src/pages/LayerFiToggleCard.jsx \
            dashboard/src/pages/MailConnectionsCard.jsx \
            dashboard/src/pages/MailSettingsPage.jsx \
            dashboard/src/pages/MailSuppressionsCard.jsx \
            dashboard/src/pages/MailTestSendCard.jsx \
            dashboard/src/pages/NotificationSendersPage.jsx \
            dashboard/src/pages/SettingsPage.jsx \
            dashboard/src/pages/StaffingEconomicsSettings.jsx \
            dashboard/src/styles.css \
            finance.html \
            index.html \
            login.html \
            login.php \
            login2.html \
            modules/accounting/api/accounts.php \
            modules/accounting/ui/ChartOfAccounts.jsx \
            modules/accounting/ui/StandardReports.jsx \
            modules/ap/api/1099.php \
            modules/ap/api/approval_policies.php \
            modules/ap/api/bills.php \
            modules/ap/api/bill_approvals.php \
            modules/ap/api/vendor_risk.php \
            modules/ap/api/vendor_portal.php \
            modules/ap/api/weekly_queue.php \
            modules/ap/lib/vendor_risk.php \
            modules/ap/ui/APModule.jsx \
            modules/ap/ui/BillsList.jsx \
            modules/ap/ui/WeeklyQueue.jsx \
            modules/billing/api/invoices.php \
            modules/billing/lib/invoice_pdf.php \
            modules/billing/ui/BillingModule.jsx \
            modules/payroll/lib/payroll.php \
            modules/payroll/lib/workflow.php \
            modules/payroll/lib/workflow_sync.php \
            modules/payroll/manifest.php \
            modules/payroll/migrations/001_init.sql \
            modules/payroll/migrations/006_run_enterprise_controls.sql \
            modules/payroll/ui/GustoConnectCard.jsx \
            modules/payroll/ui/PayPeriods.jsx \
            modules/people/api/companies.php \
            modules/people/api/documents.php \
            modules/people/api/people.php \
            modules/people/lib/companies.php \
            modules/people/lib/people.php \
            modules/people/ui/Directory.jsx \
            modules/people/ui/DirectoryModule.jsx \
            modules/people/ui/PersonDetail.jsx \
            modules/placements/api/documents.php \
            modules/placements/lib/placements.php \
            modules/placements/ui/List.jsx \
            modules/placements/ui/PlacementDetail.jsx \
            modules/reports/api/overtime_watch.php \
            modules/reports/ui/ReportsModule.jsx \
            modules/reports/ui/ReportsSidebar.jsx \
            modules/staffing/api/timesheet_email_approver.php \
            modules/staffing/api/csv_export.php \
            modules/time/api/intake.php \
            modules/time/manifest.php \
            modules/time/ui/TimeModule.jsx \
            modules/treasury/ui/TreasuryOverview.jsx \
            modules/treasury/ui/TreasuryModule.jsx \
            people.html \
            pricing.html \
            reporting.html \
            deploy/run_migrations.php \
            scripts/ap_weekly_queue_sunday.php \
            scripts/billing_recurring_generate.php \
            scripts/opcache_flush_deploy.php.template \
            signup.html \
            spa-assets/index.html \
            spa-assets/sw.js \
            spa.php \
            switch_tenant.php \
            tax.html \
            tests/login_redirect_paths_smoke.php \
            tests/ai_accuracy_query_smoke.php \
            tests/ap_1099_print_schema_smoke.php \
            tests/ap_policy_and_vendor_risk_schema_smoke.php \
            tests/ap_vendor_categories_attachments_smoke.php \
            tests/authenticated_admin_surfaces_smoke.php \
            tests/books_health_period_schema_smoke.php \
            tests/chart_of_accounts_controls_smoke.php \
            tests/company_directory_workflow_smoke.php \
            tests/csv_ai_assisted_mapping_smoke.php \
            tests/csv_external_id_wave2_smoke.php \
            tests/csv_importers_subtenant_scope_smoke.php \
            tests/csv_phase_b_smoke.php \
            tests/csv_universal_import_export_smoke.php \
            tests/export_templates_smoke.php \
            tests/document_upload_bridge_smoke.php \
            tests/integrations_health_endpoint_smoke.php \
            tests/invoice_pdf_schema_smoke.php \
            tests/m365_graph_smoke.php \
            tests/payroll_phase_a1_smoke.php \
            tests/payroll_workflow_bridge_smoke.php \
            tests/people_bulk_edit_smoke.php \
            tests/people_search_and_request_race_smoke.php \
            tests/reports_overtime_query_smoke.php \
            tests/sitewide_navigation_smoke.php \
            tests/specific_get_action_routing_smoke.php \
            tests/sweep_destination_ui_and_divergence_smoke.php \
            tests/treasury_connection_error_copy_smoke.php \
            tests/treasury_transactions_and_coa_hierarchy_smoke.php \
            tests/unfinished_route_redirects_smoke.php \
            tests/workspace_shell_smoke.php \
            wealth.html \
            "${ROOT_ASSETS[@]}"

      - name: Stage light workspace release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          source: coreflux-light-workspace-release.tar.gz
          target: /tmp/coreflux-light-workspace-${{ github.run_id }}
          overwrite: true

      - name: Publish and verify light workspace release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          command_timeout: 8m
          script: |
            set -eu
            APP_BASE="${{ secrets.CW_REMOTE_PATH }}"
            APP_ROOT="$APP_BASE/public_html"
            STAGE_ROOT="/tmp/coreflux-light-workspace-${{ github.run_id }}"
            ARCHIVE="$STAGE_ROOT/coreflux-light-workspace-release.tar.gz"
            OPCACHE_TEMPLATE="$APP_ROOT/scripts/opcache_flush_deploy.php.template"
            OPCACHE_ENDPOINT="$APP_ROOT/api/admin/opcache_flush_deploy_${{ github.run_id }}.php"
            OPCACHE_RESPONSE="/tmp/coreflux-light-workspace-opcache-${{ github.run_id }}.json"
            ENTRY_RESPONSE="/tmp/coreflux-light-workspace-entry-${{ github.run_id }}.js"

            test -n "$APP_BASE"
            test "$APP_BASE" != "/"
            test -f "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$STAGE_ROOT"
            rm -f -- "$ARCHIVE"
            test -f "$STAGE_ROOT/modules/ap/api/bills.php"
            test -f "$STAGE_ROOT/modules/placements/lib/placements.php"
            test -f "$STAGE_ROOT/modules/payroll/migrations/006_run_enterprise_controls.sql"

            cleanup_deploy() {
              rm -rf -- "$STAGE_ROOT"
              rm -f -- "$OPCACHE_ENDPOINT" "$OPCACHE_RESPONSE" "$ENTRY_RESPONSE"
            }
            trap cleanup_deploy EXIT

            cp -R --no-preserve=mode,ownership,timestamps "$STAGE_ROOT"/. "$APP_ROOT"/
            cd "$APP_ROOT"

            for PHP_FILE in \
              api/admin/integrations_health.php \
              api/ai/exceptions.php \
              api/ai_accuracy.php \
              api/books_health.php \
              core/api_bootstrap.php \
              core/storage_register.php \
              modules/accounting/api/accounts.php \
              modules/ap/api/1099.php \
              modules/ap/api/approval_policies.php \
              modules/ap/api/bills.php \
              modules/ap/api/vendor_risk.php \
              modules/ap/lib/vendor_risk.php \
              modules/billing/api/invoices.php \
              modules/billing/lib/invoice_pdf.php \
              modules/payroll/lib/payroll.php \
              modules/payroll/lib/workflow.php \
              modules/payroll/lib/workflow_sync.php \
              modules/people/api/companies.php \
              modules/people/api/documents.php \
              modules/people/api/people.php \
              modules/people/lib/companies.php \
              modules/people/lib/people.php \
              modules/placements/api/documents.php \
              modules/placements/lib/placements.php \
              modules/reports/api/overtime_watch.php; do
              php -l "$PHP_FILE"
            done

            php deploy/run_migrations.php
            php deploy/run_migrations.php --status | grep -F '[ok] modules/payroll/migrations/006_run_enterprise_controls.sql'

            php tests/login_redirect_paths_smoke.php
            php tests/ai_accuracy_query_smoke.php
            php tests/ap_1099_print_schema_smoke.php
            php tests/ap_policy_and_vendor_risk_schema_smoke.php
            php tests/ap_vendor_categories_attachments_smoke.php
            php tests/authenticated_admin_surfaces_smoke.php
            php tests/books_health_period_schema_smoke.php
            php tests/chart_of_accounts_controls_smoke.php
            php tests/company_directory_workflow_smoke.php
            php tests/csv_ai_assisted_mapping_smoke.php
            php tests/csv_external_id_wave2_smoke.php
            php tests/csv_importers_subtenant_scope_smoke.php
            php tests/csv_phase_b_smoke.php
            php tests/csv_universal_import_export_smoke.php
            php tests/export_templates_smoke.php
            php tests/document_upload_bridge_smoke.php
            php tests/integrations_health_endpoint_smoke.php
            php tests/invoice_pdf_schema_smoke.php
            php tests/m365_graph_smoke.php
            php tests/payroll_phase_a1_smoke.php
            php tests/payroll_workflow_bridge_smoke.php
            php tests/people_bulk_edit_smoke.php
            php tests/people_search_and_request_race_smoke.php
            php tests/reports_overtime_query_smoke.php
            php tests/sitewide_navigation_smoke.php
            php tests/specific_get_action_routing_smoke.php
            php tests/sweep_destination_ui_and_divergence_smoke.php
            php tests/treasury_connection_error_copy_smoke.php
            php tests/treasury_transactions_and_coa_hierarchy_smoke.php
            php tests/unfinished_route_redirects_smoke.php
            php tests/workspace_shell_smoke.php

            SPA_ENTRY="$(sed -n 's#.*src="/\(spa-assets/index-[^"]*\.js\)".*#\1#p' index.html | head -n 1)"
            SPA_STYLE="$(sed -n 's#.*href="/\(spa-assets/index-[^"]*\.css\)".*#\1#p' index.html | head -n 1)"
            test -n "$SPA_ENTRY"
            test -n "$SPA_STYLE"
            test -f "$SPA_ENTRY"
            test -f "$SPA_STYLE"
            grep -Fq -- "- $SPA_ENTRY" .deploy-version
            grep -Fq -- "- $SPA_STYLE" .deploy-version
            grep -Fq 'Your business, in focus.' "$SPA_ENTRY"
            grep -Fq 'Loaded cost' "$SPA_ENTRY"

            OPCACHE_TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
            php -r '$template=file_get_contents($argv[1]); if ($template === false || substr_count($template, "__COREFLUX_OPCACHE_TOKEN__") !== 1) exit(1); $content=str_replace("__COREFLUX_OPCACHE_TOKEN__", $argv[3], $template); if (file_put_contents($argv[2], $content, LOCK_EX) === false) exit(1); chmod($argv[2], 0640);' "$OPCACHE_TEMPLATE" "$OPCACHE_ENDPOINT" "$OPCACHE_TOKEN"
            OPCACHE_STATUS="$(curl -sS --max-time 20 -o "$OPCACHE_RESPONSE" -w '%{http_code}' -X POST -H "X-CoreFlux-Deploy-Reset: $OPCACHE_TOKEN" "https://www.corefluxapp.com/api/admin/opcache_flush_deploy_${{ github.run_id }}.php")"
            unset OPCACHE_TOKEN
            test "$OPCACHE_STATUS" = "200"
            php -r '$r=json_decode((string) file_get_contents($argv[1]), true); if (!is_array($r) || ($r["ok"] ?? false) !== true) exit(1);' "$OPCACHE_RESPONSE"

            ENTRY_NAME="$(basename "$SPA_ENTRY")"
            STYLE_NAME="$(basename "$SPA_STYLE")"
            curl -fsS --max-time 30 -o "$ENTRY_RESPONSE" "https://www.corefluxapp.com/spa-assets/$ENTRY_NAME?release=${{ github.sha }}"
            grep -Fq 'Your business, in focus.' "$ENTRY_RESPONSE"
            curl -fsS --max-time 30 -o /dev/null "https://www.corefluxapp.com/spa-assets/$STYLE_NAME?release=${{ github.sha }}"

            for ROUTE in inbox ai-agents cfo data/bulk-import admin modules/placements/list sim; do
              HEADERS="$(mktemp)"
              if ! curl -sSL --max-time 30 -o /dev/null -D "$HEADERS" "https://www.corefluxapp.com/$ROUTE?release=${{ github.sha }}"; then
                echo "Production route check could not load /$ROUTE." >&2
                cat "$HEADERS" >&2
                rm -f -- "$HEADERS"
                exit 1
              fi
              if ! grep -Eiq '^location: (https://www\.corefluxapp\.com)?/login\.html\?next=' "$HEADERS"; then
                echo "Production route /$ROUTE did not pass through the authenticated app entry point." >&2
                cat "$HEADERS" >&2
                rm -f -- "$HEADERS"
                exit 1
              fi
              rm -f -- "$HEADERS"
            done

            for ROUTE in auth/m/release-smoke-token vendor/portal share/scenario; do
              PUBLIC_RESPONSE="$(mktemp)"
              if ! curl -fsSL --max-time 30 -o "$PUBLIC_RESPONSE" "https://www.corefluxapp.com/$ROUTE?release=${{ github.sha }}"; then
                echo "Public route check could not load /$ROUTE." >&2
                rm -f -- "$PUBLIC_RESPONSE"
                exit 1
              fi
              if ! grep -Eq '/spa-assets/index-[A-Za-z0-9_-]+\.js' "$PUBLIC_RESPONSE"; then
                echo "Public route /$ROUTE did not render the React entry point." >&2
                rm -f -- "$PUBLIC_RESPONSE"
                exit 1
              fi
              rm -f -- "$PUBLIC_RESPONSE"
            done
            echo "Deployed and verified the light workspace at commit ${{ github.sha }}."
