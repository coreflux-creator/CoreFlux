name: Deploy JobDiva reconciliation

on:
  workflow_dispatch:
    inputs:
      reconcile_start_id:
        description: Optional exact JobDiva Start ID to project after deployment
        required: false
        type: string
        default: ''
      reconcile_candidate_id:
        description: Candidate ID that must own the exact Start
        required: false
        type: string
        default: ''
      reconcile_pairs:
        description: Optional comma-separated StartID:CandidateID pairs
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: coreflux-cloudways-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Package JobDiva reconciliation release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ENTRY_ASSETS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' index.html | sort -u)
          test "${#ENTRY_ASSETS[@]}" -gt 0
          BUILT_ASSETS=()
          declare -A SEEN_ASSETS=()
          for asset in "${ENTRY_ASSETS[@]}"; do
            if [ -z "${SEEN_ASSETS[$asset]:-}" ]; then
              SEEN_ASSETS[$asset]=1
              BUILT_ASSETS+=("$asset")
            fi
          done
          for ((index = 0; index < ${#BUILT_ASSETS[@]}; index++)); do
            asset="${BUILT_ASSETS[$index]}"
            test -f "spa-assets/$asset"
            if [[ "$asset" == *.js ]]; then
              mapfile -t IMPORTS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' "spa-assets/$asset" | sort -u || true)
              for imported in "${IMPORTS[@]}"; do
                if [ -z "${SEEN_ASSETS[$imported]:-}" ]; then
                  SEEN_ASSETS[$imported]=1
                  BUILT_ASSETS+=("$imported")
                fi
              done
            fi
          done
          ROOT_ASSETS=()
          for asset in "${BUILT_ASSETS[@]}"; do
            test -f "spa-assets/$asset"
            ROOT_ASSETS+=("spa-assets/$asset")
          done
          tar -czf coreflux-jobdiva-release.tar.gz \
            .deploy-version \
            api/jobdiva.php \
            api/staffing_economics_settings.php \
            core/api_bootstrap.php \
            core/tenant_scope.php \
            core/sub_tenants.php \
            core/rbac/permissions.php \
            core/staffing_economics.php \
            core/migrations/135_tenant_staffing_economics_defaults.sql \
            core/migrations/136_c2c_overhead_load.sql \
            core/migrations/137_staffing_client_catalog_backfill.sql \
            core/migrations/140_staffing_client_catalog_integrity.sql \
            core/jobdiva \
            core/qbo/sync_in.php \
            core/qbo/sync_invoices.php \
            core/integrations/entity_mappings.php \
            core/integrations/field_map.php \
            core/integrations/field_map_apply.php \
            core/integrations/payload_field_index.php \
            modules/placements/lib/economics.php \
            modules/placements/lib/placements.php \
            modules/placements/api/placements.php \
            modules/placements/lib/jobdiva_reconciliation.php \
            modules/placements/api/csv_export.php \
            modules/placements/api/csv_import.php \
            modules/placements/api/jobdiva_reconciliation.php \
            modules/placements/api/rates.php \
            modules/placements/ui/PlacementCreate.jsx \
            modules/placements/ui/PlacementDetail.jsx \
            modules/placements/ui/List.jsx \
            modules/placements/ui/JobDivaReconciliation.jsx \
            modules/staffing/api/clients.php \
            modules/staffing/api/csv_import.php \
            modules/staffing/api/csv_export.php \
            modules/staffing/manifest.php \
            modules/staffing/lib/clients.php \
            modules/staffing/lib/client_audit.php \
            modules/staffing/lib/jobs.php \
            modules/staffing/ui/Clients.jsx \
            modules/billing/api/invoices.php \
            dashboard/dist \
            dashboard/src/App.jsx \
            dashboard/src/components/AccountLink.jsx \
            dashboard/src/components/BulkEditBar.jsx \
            dashboard/src/components/ExportTemplatePicker.jsx \
            dashboard/src/components/LineChart.jsx \
            dashboard/src/layout/Sidebar.jsx \
            dashboard/src/pages/JobDivaSettings.jsx \
            dashboard/src/pages/SettingsPage.jsx \
            dashboard/src/pages/StaffingEconomicsSettings.jsx \
            dashboard/src/styles.css \
            index.html \
            modules/accounting/ui/AccountingModule.jsx \
            modules/accounting/ui/ChartOfAccounts.jsx \
            modules/accounting/ui/JournalEntries.jsx \
            modules/accounting/ui/StandardReports.jsx \
            "${ROOT_ASSETS[@]}" \
            spa-assets/index.html \
            spa-assets/sw.js \
            scripts/jobdiva_rate_write_probe.php \
            scripts/jobdiva_reconcile_start.php \
            scripts/repair_staffing_client_catalog.php \
            tests/tenant_staffing_economics_defaults_smoke.php \
            tests/staffing_client_catalog_sync_smoke.php \
            tests/staffing_client_catalog_integrity_smoke.php \
            tests/directory_bulk_controls_smoke.php \
            tests/placements_bulk_approve_drafts_queue_smoke.php \
            tests/ui_polish_smoke.php \
            tests/jobdiva_contract_projection_smoke.php \
            tests/qbo_slice3_smoke.php \
            tests/rbac_b2_smoke.php \
            tests/rbac_persona_wildcard_smoke.php \
            scripts/opcache_flush_deploy.php.template

      - name: Stage JobDiva reconciliation release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          source: "coreflux-jobdiva-release.tar.gz"
          target: /tmp/coreflux-jobdiva-deploy-${{ github.run_id }}
          overwrite: true

      - name: Publish and verify JobDiva reconciliation release
        uses: appleboy/ssh-action@v1.2.5
        env:
          RECONCILE_START_ID: ${{ inputs.reconcile_start_id }}
          RECONCILE_CANDIDATE_ID: ${{ inputs.reconcile_candidate_id }}
          RECONCILE_PAIRS: ${{ inputs.reconcile_pairs }}
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          envs: RECONCILE_START_ID,RECONCILE_CANDIDATE_ID,RECONCILE_PAIRS
          command_timeout: 8m
          script: |
            set -eu
            APP_BASE="${{ secrets.CW_REMOTE_PATH }}"
            APP_ROOT="$APP_BASE/public_html"
            STAGE_ROOT="/tmp/coreflux-jobdiva-deploy-${{ github.run_id }}"
            OPCACHE_TEMPLATE="$APP_ROOT/scripts/opcache_flush_deploy.php.template"
            OPCACHE_ENDPOINT="$APP_ROOT/api/admin/opcache_flush_deploy_${{ github.run_id }}.php"
            OPCACHE_RESPONSE="/tmp/coreflux-jobdiva-opcache-${{ github.run_id }}.json"

            test -n "$APP_BASE"
            test "$APP_BASE" != "/"
            test -f "$STAGE_ROOT/coreflux-jobdiva-release.tar.gz"
            tar -xzf "$STAGE_ROOT/coreflux-jobdiva-release.tar.gz" -C "$STAGE_ROOT"
            rm -f -- "$STAGE_ROOT/coreflux-jobdiva-release.tar.gz"
            test -f "$STAGE_ROOT/core/jobdiva/assignment_contract.php"
            test -f "$STAGE_ROOT/core/jobdiva/projector.php"
            test -f "$STAGE_ROOT/core/integrations/field_map_apply.php"
            test -f "$STAGE_ROOT/core/staffing_economics.php"
            test -f "$STAGE_ROOT/core/migrations/135_tenant_staffing_economics_defaults.sql"
            test -f "$STAGE_ROOT/core/migrations/136_c2c_overhead_load.sql"
            test -f "$STAGE_ROOT/core/migrations/137_staffing_client_catalog_backfill.sql"
            test -f "$STAGE_ROOT/core/migrations/140_staffing_client_catalog_integrity.sql"
            test -f "$STAGE_ROOT/api/staffing_economics_settings.php"
            test -f "$STAGE_ROOT/modules/placements/lib/economics.php"
            test -f "$STAGE_ROOT/modules/placements/api/placements.php"
            test -f "$STAGE_ROOT/modules/staffing/api/clients.php"
            test -f "$STAGE_ROOT/dashboard/src/components/BulkEditBar.jsx"
            test -f "$STAGE_ROOT/modules/staffing/lib/client_audit.php"
            test -f "$STAGE_ROOT/modules/staffing/lib/jobs.php"
            test -f "$STAGE_ROOT/scripts/repair_staffing_client_catalog.php"
            SPA_ENTRY="$(sed -n 's#.*src="/\(spa-assets/index-[^"]*\.js\)".*#\1#p' "$STAGE_ROOT/index.html" | head -n 1)"
            test -n "$SPA_ENTRY"
            test -f "$STAGE_ROOT/$SPA_ENTRY"

            cleanup_deploy() {
              rm -rf -- "$STAGE_ROOT"
              rm -f -- "$OPCACHE_ENDPOINT" "$OPCACHE_RESPONSE" "$OPCACHE_TEMPLATE"
            }
            trap cleanup_deploy EXIT

            cp -R --no-preserve=mode,ownership,timestamps "$STAGE_ROOT"/. "$APP_ROOT"/
            cd "$APP_ROOT"

            grep -Fq 'jobdivaAssignmentContractEntries([$row])' core/jobdiva/assignment_contract.php
            grep -Fq 'jobdivaProjectorSourceContractDrift' core/jobdiva/projector.php
            grep -Fq 'authoritative_jobdiva_assignment_contract' core/integrations/field_map_apply.php
            grep -Fq "force_source_fields'] = true" modules/placements/lib/economics.php
            grep -Fq 'staffingEconomicsResolveW2Costs' modules/placements/lib/economics.php
            grep -Fq 'staffingEconomicsResolveC2COverhead' modules/placements/lib/economics.php
            grep -Fq 'Blank fields inherit tenant defaults' "$SPA_ENTRY"
            grep -Fq 'C2C overhead / load' "$SPA_ENTRY"
            grep -Fq 'JobDiva placement reconciliation' "$SPA_ENTRY"
            grep -Fq "setRequestModuleScope('placements')" modules/staffing/api/clients.php
            grep -Fq 'staffingClientCatalogTenantId' core/qbo/sync_in.php
            grep -Fq 'EmployeeAssignmentRecordsDetail.BILLING.COMPANY' core/jobdiva/projector.php
            grep -Fq 'Placement billing company' modules/staffing/api/clients.php
            grep -Fq "action === 'bulk_update'" modules/placements/api/placements.php
            grep -Fq "action === 'bulk_update'" modules/staffing/api/clients.php
            grep -Fq 'directory-page__header' "$SPA_ENTRY"
            grep -Fq 'Search placements, people, clients, IDs' "$SPA_ENTRY"
            grep -Fq 'accounting-more-trigger' "$SPA_ENTRY"
            grep -Fq "$(basename "$SPA_ENTRY")" index.html

            OPCACHE_TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
            php -r '$template=file_get_contents($argv[1]); if ($template === false || substr_count($template, "__COREFLUX_OPCACHE_TOKEN__") !== 1) exit(1); $content=str_replace("__COREFLUX_OPCACHE_TOKEN__", $argv[3], $template); if (file_put_contents($argv[2], $content, LOCK_EX) === false) exit(1); chmod($argv[2], 0640);' "$OPCACHE_TEMPLATE" "$OPCACHE_ENDPOINT" "$OPCACHE_TOKEN"
            rm -f -- "$OPCACHE_TEMPLATE"
            OPCACHE_STATUS="$(curl -sS --max-time 20 -o "$OPCACHE_RESPONSE" -w '%{http_code}' -X POST -H "X-CoreFlux-Deploy-Reset: $OPCACHE_TOKEN" "https://www.corefluxapp.com/api/admin/opcache_flush_deploy_${{ github.run_id }}.php")"
            unset OPCACHE_TOKEN
            test "$OPCACHE_STATUS" = "200"
            php -r '$r=json_decode((string) file_get_contents($argv[1]), true); if (!is_array($r) || ($r["ok"] ?? false) !== true) exit(1);' "$OPCACHE_RESPONSE"

            php deploy/run_migrations.php
            php deploy/run_migrations.php --status | grep -F 'core/migrations/135_tenant_staffing_economics_defaults.sql'
            php deploy/run_migrations.php --status | grep -F 'core/migrations/136_c2c_overhead_load.sql'
            php deploy/run_migrations.php --status | grep -F 'core/migrations/137_staffing_client_catalog_backfill.sql'
            php deploy/run_migrations.php --status | grep -F 'core/migrations/140_staffing_client_catalog_integrity.sql'
            php -l core/staffing_economics.php
            php -l core/api_bootstrap.php
            php -l core/tenant_scope.php
            php -l core/sub_tenants.php
            php -l core/rbac/permissions.php
            php -l api/staffing_economics_settings.php
            find core/jobdiva -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            php -l core/integrations/field_map.php
            php -l core/integrations/field_map_apply.php
            php -l modules/placements/lib/economics.php
            php -l modules/placements/lib/placements.php
            php -l modules/placements/api/placements.php
            php -l modules/placements/api/csv_export.php
            php -l modules/placements/api/csv_import.php
            php -l modules/placements/api/rates.php
            php -l modules/staffing/api/clients.php
            php -l modules/staffing/api/csv_import.php
            php -l modules/staffing/api/csv_export.php
            php -l modules/staffing/lib/clients.php
            php -l modules/staffing/lib/client_audit.php
            php -l modules/staffing/lib/jobs.php
            php -l core/qbo/sync_in.php
            php -l core/qbo/sync_invoices.php
            php -l modules/billing/api/invoices.php
            php -l scripts/jobdiva_rate_write_probe.php
            php -l scripts/jobdiva_reconcile_start.php
            php -l scripts/repair_staffing_client_catalog.php
            php -r 'require "core/jobdiva/sync.php"; $r=jobdivaCompactStoredAssignmentMirrors(2); $growth=($r["bytes_after"] ?? 0) > ($r["bytes_before"] ?? 0); echo ($growth ? "WARNING: JobDiva mirror compaction increased storage; continuing because publication and functional probes are authoritative.\n" : ""); echo "JobDiva mirrors compacted: {$r["compacted"]} of {$r["checked"]}; {$r["bytes_before"]} -> {$r["bytes_after"]} bytes.\n";'
            php -d memory_limit=512M -r 'require "core/jobdiva/sync.php"; $plan=jobdivaStoredAssignmentProjectionPlan(2, 20, [], false, 0); $rows=count($plan["public_rows"] ?? []); $total=(int)($plan["pagination"]["total"] ?? 0); if ($rows < 1 || $total < $rows) { fwrite(STDERR, "Stored preview returned an invalid page.\n"); exit(1); } echo "Stored preview verified: {$rows} of {$total} assignments.\n";'
            if [ -n "$RECONCILE_START_ID" ] || [ -n "$RECONCILE_CANDIDATE_ID" ]; then
              test -n "$RECONCILE_START_ID"
              test -n "$RECONCILE_CANDIDATE_ID"
              php scripts/jobdiva_reconcile_start.php 2 "$RECONCILE_START_ID" "$RECONCILE_CANDIDATE_ID"
            fi
            if [ -n "$RECONCILE_PAIRS" ]; then
              OLD_IFS="$IFS"
              IFS=','
              for PAIR in $RECONCILE_PAIRS; do
                START_ID="${PAIR%%:*}"
                CANDIDATE_ID="${PAIR#*:}"
                test -n "$START_ID"
                test -n "$CANDIDATE_ID"
                test "$START_ID" != "$CANDIDATE_ID"
                php scripts/jobdiva_reconcile_start.php 2 "$START_ID" "$CANDIDATE_ID"
              done
              IFS="$OLD_IFS"
            fi
            php scripts/jobdiva_rate_write_probe.php --active-roster 2
            php scripts/repair_staffing_client_catalog.php 2
            php tests/staffing_client_catalog_sync_smoke.php
            php tests/staffing_client_catalog_integrity_smoke.php
            php tests/directory_bulk_controls_smoke.php
            php tests/placements_bulk_approve_drafts_queue_smoke.php
            php tests/ui_polish_smoke.php
            php tests/jobdiva_contract_projection_smoke.php
            php tests/qbo_slice3_smoke.php
            php tests/rbac_b2_smoke.php
            php tests/rbac_persona_wildcard_smoke.php
            php -r 'require "modules/staffing/lib/clients.php"; $catalogTenant=staffingClientCatalogTenantId(2); $summary=staffingClientCatalogIntegritySummary($catalogTenant); if (($summary["active_clients"] ?? 0) < 1 || ($summary["client_company_mismatches"] ?? 0) > 0 || ($summary["active_jobdiva_placeholders"] ?? 0) > 0 || ($summary["active_unproven_clients"] ?? 0) > 0 || ($summary["active_placements_with_inactive_client"] ?? 0) > 0) { fwrite(STDERR, "Client catalog failed: ".json_encode($summary)."\n"); exit(1); } echo "Client catalog verified: ".json_encode($summary)."\n";'
            echo "Deployed and verified commit ${{ github.sha }}."
