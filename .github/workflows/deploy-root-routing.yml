name: Deploy root dashboard routing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreflux-cloudways-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Package root routing release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ENTRY_ASSETS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' index.html | sort -u)
          test "${#ENTRY_ASSETS[@]}" -gt 0
          BUILT_ASSETS=()
          declare -A SEEN_ASSETS=()
          for asset in "${ENTRY_ASSETS[@]}"; do
            if [ -z "${SEEN_ASSETS[$asset]:-}" ]; then
              SEEN_ASSETS[$asset]=1
              BUILT_ASSETS+=("$asset")
            fi
          done
          for ((index = 0; index < ${#BUILT_ASSETS[@]}; index++)); do
            asset="${BUILT_ASSETS[$index]}"
            test -f "spa-assets/$asset"
            if [[ "$asset" == *.js ]]; then
              mapfile -t IMPORTS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' "spa-assets/$asset" | sort -u || true)
              for imported in "${IMPORTS[@]}"; do
                if [ -z "${SEEN_ASSETS[$imported]:-}" ]; then
                  SEEN_ASSETS[$imported]=1
                  BUILT_ASSETS+=("$imported")
                fi
              done
            fi
          done
          ROOT_ASSETS=()
          for asset in "${BUILT_ASSETS[@]}"; do
            test -f "spa-assets/$asset"
            ROOT_ASSETS+=("spa-assets/$asset")
          done
          tar -czf coreflux-root-routing-release.tar.gz \
            .deploy-version \
            .htaccess \
            assets/brand \
            auth/logout.php \
            dashboard/dist \
            dashboard/src/App.jsx \
            index.html \
            login.html \
            login.php \
            spa.php \
            spa-assets/index.html \
            spa-assets/sw.js \
            scripts/opcache_flush_deploy.php.template \
            tests/login_redirect_paths_smoke.php \
            tests/magic_link_auth_smoke.php \
            tests/sprint1_login_and_module_filter_smoke.php \
            "${ROOT_ASSETS[@]}"

      - name: Stage root routing release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          source: coreflux-root-routing-release.tar.gz
          target: /tmp/coreflux-root-routing-${{ github.run_id }}
          overwrite: true

      - name: Publish and verify root routing
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          command_timeout: 8m
          script: |
            set -eu
            APP_BASE="${{ secrets.CW_REMOTE_PATH }}"
            APP_ROOT="$APP_BASE/public_html"
            STAGE_ROOT="/tmp/coreflux-root-routing-${{ github.run_id }}"
            OPCACHE_TEMPLATE="$APP_ROOT/scripts/opcache_flush_deploy.php.template"
            OPCACHE_ENDPOINT="$APP_ROOT/api/admin/opcache_flush_deploy_${{ github.run_id }}.php"
            OPCACHE_RESPONSE="/tmp/coreflux-root-routing-opcache-${{ github.run_id }}.json"

            test -n "$APP_BASE"
            test "$APP_BASE" != "/"
            test -f "$STAGE_ROOT/coreflux-root-routing-release.tar.gz"
            tar -xzf "$STAGE_ROOT/coreflux-root-routing-release.tar.gz" -C "$STAGE_ROOT"
            rm -f -- "$STAGE_ROOT/coreflux-root-routing-release.tar.gz"
            test -f "$STAGE_ROOT/.htaccess"
            test -f "$STAGE_ROOT/spa.php"
            test -f "$STAGE_ROOT/assets/brand/coreflux-logo.png"
            test -f "$STAGE_ROOT/assets/brand/coreflux-mark.png"

            cleanup_deploy() {
              rm -rf -- "$STAGE_ROOT"
              rm -f -- "$OPCACHE_ENDPOINT" "$OPCACHE_RESPONSE"
            }
            trap cleanup_deploy EXIT

            cp -R --no-preserve=mode,ownership,timestamps "$STAGE_ROOT"/. "$APP_ROOT"/
            cd "$APP_ROOT"
            php -l spa.php
            php -l login.php
            php tests/login_redirect_paths_smoke.php
            php tests/magic_link_auth_smoke.php
            php tests/sprint1_login_and_module_filter_smoke.php

            SPA_ENTRY="$(sed -n 's#.*src="/\(spa-assets/index-[^"]*\.js\)".*#\1#p' index.html | head -n 1)"
            test -n "$SPA_ENTRY"
            test -f "$SPA_ENTRY"
            grep -Fq 'login.html?next=' "$SPA_ENTRY"

            OPCACHE_TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
            php -r '$template=file_get_contents($argv[1]); if ($template === false || substr_count($template, "__COREFLUX_OPCACHE_TOKEN__") !== 1) exit(1); $content=str_replace("__COREFLUX_OPCACHE_TOKEN__", $argv[3], $template); if (file_put_contents($argv[2], $content, LOCK_EX) === false) exit(1); chmod($argv[2], 0640);' "$OPCACHE_TEMPLATE" "$OPCACHE_ENDPOINT" "$OPCACHE_TOKEN"
            OPCACHE_STATUS="$(curl -sS --max-time 20 -o "$OPCACHE_RESPONSE" -w '%{http_code}' -X POST -H "X-CoreFlux-Deploy-Reset: $OPCACHE_TOKEN" "https://www.corefluxapp.com/api/admin/opcache_flush_deploy_${{ github.run_id }}.php")"
            unset OPCACHE_TOKEN
            test "$OPCACHE_STATUS" = "200"
            php -r '$r=json_decode((string) file_get_contents($argv[1]), true); if (!is_array($r) || ($r["ok"] ?? false) !== true) exit(1);' "$OPCACHE_RESPONSE"
            rm -f -- "$OPCACHE_ENDPOINT" "$OPCACHE_RESPONSE"

            PURGE_STATUS="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X PURGE -H 'Host: www.corefluxapp.com' 'http://127.0.0.1/' || true)"
            case "$PURGE_STATUS" in 200|204) ;; *) echo "Homepage cache purge failed with HTTP $PURGE_STATUS." >&2; exit 1 ;; esac

            ROOT_HEADERS="$(mktemp)"
            LEGACY_HEADERS="$(mktemp)"
            LOGIN_BODY="$(mktemp)"
            trap 'rm -rf -- "$STAGE_ROOT"; rm -f -- "$OPCACHE_ENDPOINT" "$OPCACHE_RESPONSE" "$ROOT_HEADERS" "$LEGACY_HEADERS" "$LOGIN_BODY"' EXIT
            curl -sS --max-time 20 -D "$ROOT_HEADERS" -o /dev/null 'https://www.corefluxapp.com/'
            grep -Eq '^HTTP/[^ ]+ 302' "$ROOT_HEADERS"
            grep -Eiq '^location: /login\.html\?next=%2F' "$ROOT_HEADERS"
            curl -sS --max-time 20 -D "$LEGACY_HEADERS" -o /dev/null 'https://www.corefluxapp.com/login?next=%2F'
            grep -Eq '^HTTP/[^ ]+ 302' "$LEGACY_HEADERS"
            grep -Eiq '^location: https?://[^/]+/login\.html\?next=%2F|^location: /login\.html\?next=%2F' "$LEGACY_HEADERS"
            curl -fsSL --max-time 20 'https://www.corefluxapp.com/' -o "$LOGIN_BODY"
            grep -Fq 'Welcome Back' "$LOGIN_BODY"
            curl -fsS --max-time 20 'https://www.corefluxapp.com/assets/brand/coreflux-logo.png' -o /dev/null
            curl -fsS --max-time 20 'https://www.corefluxapp.com/assets/brand/coreflux-mark.png' -o /dev/null
            echo "Deployed and verified root dashboard routing at commit ${{ github.sha }}."
