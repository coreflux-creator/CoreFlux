name: Deploy CoreFlux to Cloudways

on:
  workflow_dispatch:
    inputs:
      qbo_environment:
        description: QuickBooks credential environment for this deployment
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - production
      data_key_recovery:
        description: Secure production data-key recovery phase
        required: true
        type: choice
        default: none
        options:
          - none
          - prepare
          - capture
          - restore
          - cleanup
      qbo_sandbox_payment_smoke:
        description: Explicitly run a $1 Intuit sandbox charge (no CoreFlux invoice/payment)
        required: true
        type: choice
        default: none
        options:
          - none
          - charge_one_dollar
      qbo_sandbox_smoke_realm_id:
        description: Exact sandbox realm ID; required only for the $1 payment smoke
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: coreflux-cloudways-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Upload the QuickBooks integration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          source: ".deploy-version,INTEGRATION_QUALITY_CHARTER.md,api/admin/integration_triage.php,api/admin/opcache_flush.php,api/admin/qbo/payments_charge.php,api/qbo.php,api/qbo/account_map_manual.php,api/webhooks/qbo.php,assets/css/legal.css,core/config.local.example.php,core/encryption.php,core/migrations/129_qbo_payments_idempotency.sql,core/migrations/130_qbo_volatile_access_tokens.sql,core/qbo/client.php,core/qbo/payments_client.php,cron/qbo_payments_poll.php,dashboard/dist/index.html,dashboard/src/pages/IntegrationTriage.jsx,dashboard/src/pages/QboSettings.jsx,index.html,modules/billing/ui/BillingModule.jsx,modules/billing/ui/InvoicesList.jsx,modules/billing/ui/QboPaymentsCollectModal.jsx,privacy.html,qbo-connect.php,qbo-oauth-callback.php,quickbooks-connect.html,quickbooks-disconnect.html,scripts/configure_qbo.php,scripts/encryption_key_inventory.php,scripts/opcache_flush_deploy.php.template,scripts/qbo_sandbox_payment_smoke.php,scripts/recover_data_key.php,scripts/validate_data_key.php,spa-assets/index-BC5g6YJu.css,spa-assets/index-Bd7IXaN3.css,spa-assets/index-DFz7J81-.js,spa-assets/index-CzcA_UTr.js,spa-assets/index.html,spa-assets/sw.js,spa.php,terms.html,tests/data_key_recovery_smoke.php,tests/integration_triage_smoke.php,tests/qbo_account_import_jaz_parity_smoke.php,tests/qbo_foundation_smoke.php,tests/qbo_go_live_assets_smoke.php,tests/qbo_intuit_tokenizer_smoke.php,tests/qbo_payments_client_smoke.php,tests/qbo_payments_poll_smoke.php,tests/qbo_recaptcha_smoke.php,tests/qbo_sandbox_payment_smoke_guard_smoke.php"
          # Cloudways serves public_html from files owned by PHP-FPM. Extract
          # into a per-run, SSH-user-owned staging directory first so tar does
          # not fail while trying to change production file metadata.
          target: /tmp/coreflux-qbo-deploy-${{ github.run_id }}
          overwrite: true

      - name: Install QuickBooks credentials, apply migrations, and configure workers
        uses: appleboy/ssh-action@v1.2.5
        env:
          QBO_CLIENT_ID: ${{ inputs.qbo_environment == 'production' && secrets.QBO_PRODUCTION_CLIENT_ID || secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ inputs.qbo_environment == 'production' && secrets.QBO_PRODUCTION_CLIENT_SECRET || secrets.QBO_CLIENT_SECRET }}
          QBO_WEBHOOK_VERIFIER_TOKEN: ${{ secrets.QBO_WEBHOOK_VERIFIER_TOKEN }}
          QBO_RECAPTCHA_SITE_KEY: ${{ secrets.QBO_RECAPTCHA_SITE_KEY }}
          QBO_RECAPTCHA_SECRET_KEY: ${{ secrets.QBO_RECAPTCHA_SECRET_KEY }}
          QBO_RECAPTCHA_ALLOWED_HOSTS: corefluxapp.com,www.corefluxapp.com
          QBO_REDIRECT_URI: https://www.corefluxapp.com/api/qbo/oauth_callback.php
          QBO_ENV: ${{ inputs.qbo_environment || 'sandbox' }}
          QBO_SCOPES: com.intuit.quickbooks.accounting com.intuit.quickbooks.payment
          DATA_KEY_RECOVERY_MODE: ${{ inputs.data_key_recovery || 'none' }}
          COREFLUX_QBO_SANDBOX_SMOKE: ${{ inputs.qbo_sandbox_payment_smoke || 'none' }}
          QBO_SANDBOX_SMOKE_REALM_ID: ${{ inputs.qbo_sandbox_smoke_realm_id || '' }}
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          envs: QBO_CLIENT_ID,QBO_CLIENT_SECRET,QBO_WEBHOOK_VERIFIER_TOKEN,QBO_RECAPTCHA_SITE_KEY,QBO_RECAPTCHA_SECRET_KEY,QBO_RECAPTCHA_ALLOWED_HOSTS,QBO_REDIRECT_URI,QBO_ENV,QBO_SCOPES,DATA_KEY_RECOVERY_MODE,COREFLUX_QBO_SANDBOX_SMOKE,QBO_SANDBOX_SMOKE_REALM_ID
          command_timeout: 10m
          script: |
            set -eu
            APP_BASE="${{ secrets.CW_REMOTE_PATH }}"
            APP_ROOT="$APP_BASE/public_html"
            STAGE_ROOT="/tmp/coreflux-qbo-deploy-${{ github.run_id }}"
            test -n "$APP_BASE"
            test "$APP_BASE" != "/"
            test "$STAGE_ROOT" = "/tmp/coreflux-qbo-deploy-${{ github.run_id }}"
            test -d "$STAGE_ROOT/core/qbo"
            OPCACHE_ENDPOINT=""
            OPCACHE_RESPONSE=""
            OPCACHE_TEMPLATE="$APP_ROOT/scripts/opcache_flush_deploy.php.template"
            test "$OPCACHE_TEMPLATE" = "$APP_ROOT/scripts/opcache_flush_deploy.php.template"
            cleanup_deploy() {
              rm -rf -- "$STAGE_ROOT"
              if [ -n "$OPCACHE_ENDPOINT" ]; then rm -f -- "$OPCACHE_ENDPOINT"; fi
              if [ -n "$OPCACHE_RESPONSE" ]; then rm -f -- "$OPCACHE_RESPONSE"; fi
              rm -f -- "$OPCACHE_TEMPLATE"
            }
            trap cleanup_deploy EXIT
            cp -R --no-preserve=mode,ownership,timestamps "$STAGE_ROOT"/. "$APP_ROOT"/
            cd "$APP_ROOT"
            grep -Fq 'CURRENT_TIMESTAMP - INTERVAL 30 MINUTE' core/qbo/client.php
            grep -Fq 'return $stmt->rowCount() === 1;' core/qbo/client.php
            RECOVERY_MODE="${DATA_KEY_RECOVERY_MODE:-none}"
            case "$RECOVERY_MODE" in none|prepare|capture|restore|cleanup) ;; *) echo 'Invalid data-key recovery mode.' >&2; exit 1 ;; esac
            RECOVERY_ID="$(printf '%s' "$APP_BASE" | sha256sum | cut -c1-16)"
            case "$RECOVERY_ID" in ''|*[!a-f0-9]*) echo 'Unable to derive the recovery directory.' >&2; exit 1 ;; esac
            RECOVERY_DIR="$HOME/.coreflux-recovery-$RECOVERY_ID"
            test "$(dirname "$RECOVERY_DIR")" = "$HOME"
            test ! -L "$RECOVERY_DIR"
            umask 077
            mkdir -p "$RECOVERY_DIR"
            chmod 0700 "$RECOVERY_DIR"
            RECOVERY_ESCROW="$RECOVERY_DIR/.coreflux-data-key-recovery"
            RECOVERY_ARCHIVE="$RECOVERY_DIR/pre-key-recovery.tar.gz"
            RECOVERY_ARCHIVE_TEMP="$RECOVERY_DIR/pre-key-recovery.tar.gz.tmp"
            if [ "$RECOVERY_MODE" = 'prepare' ]; then
              test "$RECOVERY_ARCHIVE" = "$RECOVERY_DIR/pre-key-recovery.tar.gz"
              test "$RECOVERY_ARCHIVE_TEMP" = "$RECOVERY_DIR/pre-key-recovery.tar.gz.tmp"
              test ! -e "$RECOVERY_ARCHIVE"
              test ! -e "$RECOVERY_ARCHIVE_TEMP"
              SOURCE_KB="$(du -sk "$APP_ROOT" "$APP_BASE/private_html" 2>/dev/null | awk '{ total += $1 } END { print total + 0 }')"
              FREE_KB="$(df -Pk "$APP_BASE" | awk 'NR==2 { print $4 }')"
              test "$FREE_KB" -gt $((SOURCE_KB + 102400))
              tar -czf "$RECOVERY_ARCHIVE_TEMP" -C "$APP_BASE" public_html private_html
              tar -tzf "$RECOVERY_ARCHIVE_TEMP" >/dev/null
              mv "$RECOVERY_ARCHIVE_TEMP" "$RECOVERY_ARCHIVE"
              chmod 0600 "$RECOVERY_ARCHIVE"
              echo "Pre-recovery web-file snapshot prepared and verified; bytes=$(stat -c %s "$RECOVERY_ARCHIVE")."
              SCRIPT_RECOVERY_MODE=none
            elif [ "$RECOVERY_MODE" = 'cleanup' ]; then
              SCRIPT_RECOVERY_MODE=none
            else
              SCRIPT_RECOVERY_MODE="$RECOVERY_MODE"
            fi
            php scripts/recover_data_key.php "$SCRIPT_RECOVERY_MODE" "$APP_BASE" "$RECOVERY_ESCROW"
            php scripts/configure_qbo.php
            OPCACHE_ENDPOINT="$APP_ROOT/api/admin/opcache_flush_deploy_${{ github.run_id }}.php"
            OPCACHE_RESPONSE="/tmp/coreflux-opcache-response-${{ github.run_id }}.json"
            test "$OPCACHE_ENDPOINT" = "$APP_ROOT/api/admin/opcache_flush_deploy_${{ github.run_id }}.php"
            test "$OPCACHE_RESPONSE" = "/tmp/coreflux-opcache-response-${{ github.run_id }}.json"
            test -f "$OPCACHE_TEMPLATE"
            OPCACHE_TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
            php -r '$template=file_get_contents($argv[1]); if ($template === false || substr_count($template, "__COREFLUX_OPCACHE_TOKEN__") !== 1) exit(1); $content=str_replace("__COREFLUX_OPCACHE_TOKEN__", $argv[3], $template); if (file_put_contents($argv[2], $content, LOCK_EX) === false) exit(1); chmod($argv[2], 0640);' "$OPCACHE_TEMPLATE" "$OPCACHE_ENDPOINT" "$OPCACHE_TOKEN"
            rm -f -- "$OPCACHE_TEMPLATE"
            OPCACHE_STATUS="$(curl -sS --max-time 20 -o "$OPCACHE_RESPONSE" -w '%{http_code}' -X POST -H "X-CoreFlux-Deploy-Reset: $OPCACHE_TOKEN" 'https://www.corefluxapp.com/api/admin/opcache_flush_deploy_${{ github.run_id }}.php')"
            unset OPCACHE_TOKEN
            test "$OPCACHE_STATUS" = '200'
            php -r '$r=json_decode((string) file_get_contents($argv[1]), true); if (!is_array($r) || ($r["ok"] ?? false) !== true) exit(1); echo "PHP OPcache reset through one-time deployment endpoint.\n";' "$OPCACHE_RESPONSE"
            rm -f -- "$OPCACHE_ENDPOINT" "$OPCACHE_RESPONSE"
            OPCACHE_ENDPOINT=""
            OPCACHE_RESPONSE=""
            test -f core/migrations/129_qbo_payments_idempotency.sql
            test -f core/migrations/130_qbo_volatile_access_tokens.sql
            test -f api/qbo/account_map_manual.php
            grep -q 'function qboApplyCapturedPayment' core/qbo/payments_client.php
            grep -q 'spa-assets/index-DFz7J81-.js' index.html
            php deploy/run_migrations.php
            php deploy/run_migrations.php --status | grep 'core/migrations/129_qbo_payments_idempotency.sql'
            php deploy/run_migrations.php --status | grep 'core/migrations/130_qbo_volatile_access_tokens.sql'
            php -r 'require "core/qbo/client.php"; $n=(int)getDB()->query("SELECT COUNT(*) FROM qbo_connections WHERE OCTET_LENGTH(access_token_ct) > 0")->fetchColumn(); echo "Persisted QBO access tokens: ",$n,PHP_EOL; exit($n === 0 ? 0 : 1);'
            php -r 'require "core/qbo/client.php"; $tid=(int)getDB()->query("SELECT tenant_id FROM qbo_connections WHERE status = \"active\" ORDER BY tenant_id LIMIT 1")->fetchColumn(); if($tid<=0){echo "QBO volatile-token live check: no active connection.\n";exit(0);} qboPing($tid, null); echo "QBO volatile-token live check: passed.\n";'
            php tests/qbo_go_live_assets_smoke.php
            php tests/qbo_recaptcha_smoke.php
            curl -fsS --max-time 20 'https://www.corefluxapp.com/privacy.html' | grep -Fq 'data-policy="coreflux-privacy-v1"'
            curl -fsS --max-time 20 'https://www.corefluxapp.com/terms.html' | grep -Fq 'data-policy="coreflux-terms-eula-v1"'
            curl -fsS --max-time 20 'https://www.corefluxapp.com/quickbooks-connect.html' | grep -Fq 'data-qbo-lifecycle="connect-reconnect"'
            curl -fsS --max-time 20 'https://www.corefluxapp.com/quickbooks-disconnect.html' | grep -Fq 'data-qbo-lifecycle="disconnect"'
            curl -fsS --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' 'https://www.corefluxapp.com/api/webhooks/qbo.php' | grep -Fq '"verify_error":"header_missing"'

            PAYMENT_SMOKE_MODE="${COREFLUX_QBO_SANDBOX_SMOKE:-none}"
            case "$PAYMENT_SMOKE_MODE" in none|charge_one_dollar) ;; *) echo 'Invalid QBO sandbox payment smoke mode.' >&2; exit 1 ;; esac
            if [ "$PAYMENT_SMOKE_MODE" = 'charge_one_dollar' ]; then
              case "${QBO_SANDBOX_SMOKE_REALM_ID:-}" in ''|*[!0-9]*) echo 'Exact numeric sandbox realm ID is required.' >&2; exit 1 ;; esac
              php scripts/qbo_sandbox_payment_smoke.php "$QBO_SANDBOX_SMOKE_REALM_ID"
            fi

            mkdir -p logs
            CRON_BACKUP="$HOME/.coreflux-crontab-before-qbo-$(date +%Y%m%d%H%M%S)"
            CRON_NEXT="$(mktemp)"
            (crontab -l 2>/dev/null || true) | tee "$CRON_BACKUP" \
              | sed '/qbo_token_refresh\.php/d; /qbo_two_way_sync\.php/d; /qbo_payments_poll\.php/d; /# CoreFlux QBO workers/d' \
              > "$CRON_NEXT"
            PHP_BIN="$(command -v php)"
            {
              echo '# CoreFlux QBO workers'
              echo "*/15 * * * * cd $APP_ROOT && $PHP_BIN cron/qbo_token_refresh.php >> logs/qbo_token_refresh.log 2>&1"
              echo "*/30 * * * * cd $APP_ROOT && $PHP_BIN cron/qbo_two_way_sync.php >> logs/qbo_two_way_sync.log 2>&1"
              echo "7 * * * * cd $APP_ROOT && $PHP_BIN cron/qbo_payments_poll.php >> logs/qbo_payments_poll.log 2>&1"
            } >> "$CRON_NEXT"
            crontab "$CRON_NEXT"
            rm -f "$CRON_NEXT"

            grep -q 'spa-assets/index-DFz7J81-.js' .deploy-version
            test -f spa-assets/index-DFz7J81-.js
            grep -q 'index-CzcA_UTr.js' spa-assets/index-DFz7J81-.js
            test -f spa-assets/index-CzcA_UTr.js
            echo 'QBO config presence:'
            php -r '$p="core/config.local.php"; if (is_file($p)) require $p; foreach (["QBO_CLIENT_ID","QBO_CLIENT_SECRET","QBO_WEBHOOK_VERIFIER_TOKEN","QBO_RECAPTCHA_SITE_KEY","QBO_RECAPTCHA_SECRET_KEY","QBO_REDIRECT_URI","QBO_ENV","QBO_SCOPES"] as $k) { $v=defined($k)?constant($k):getenv($k); echo $k,"=",(is_string($v)&&trim($v)!==""?"set":"missing"),PHP_EOL; }'
            php -r 'require "core/qbo/client.php"; $db=getDB(); $s=$db->query("SELECT tenant_id, created_at, consumed_at IS NOT NULL AS consumed, TIMESTAMPDIFF(SECOND, created_at, CURRENT_TIMESTAMP) AS age_seconds FROM qbo_oauth_state ORDER BY id DESC LIMIT 1")->fetch(PDO::FETCH_ASSOC); $active=(int)$db->query("SELECT COUNT(*) FROM qbo_connections WHERE status = \"active\"")->fetchColumn(); $matched=false; $connects=0; if($s){$q=$db->prepare("SELECT status FROM qbo_connections WHERE tenant_id=:t LIMIT 1");$q->execute(["t"=>(int)$s["tenant_id"]]);$matched=(bool)$q->fetchColumn();$q=$db->prepare("SELECT COUNT(*) FROM qbo_sync_audit WHERE tenant_id=:t AND action=\"connect\" AND occurred_at>=:c");$q->execute(["t"=>(int)$s["tenant_id"],"c"=>$s["created_at"]]);$connects=(int)$q->fetchColumn();} $a=$db->query("SELECT action, ok, detail FROM qbo_sync_audit ORDER BY id DESC LIMIT 1")->fetch(PDO::FETCH_ASSOC); echo "OAuth diagnostic: state_present=",($s?"yes":"no")," consumed=",($s?(int)$s["consumed"]:-1)," age_seconds=",($s?(int)$s["age_seconds"]:-1)," connection_for_state=",($matched?"yes":"no")," connect_audits_after_state=",$connects," active_connections=",$active," last_audit=",($a?$a["action"]:"none")," last_audit_ok=",($a?(int)$a["ok"]:-1)," last_audit_detail=",($a?substr(preg_replace("/[\\r\\n]+/"," ",(string)$a["detail"]),0,500):"none"),PHP_EOL;'
            php -r 'require "core/qbo/client.php"; $db=getDB(); $s=$db->query("SELECT tenant_id, created_at FROM qbo_oauth_state ORDER BY id DESC LIMIT 1")->fetch(PDO::FETCH_ASSOC); $trace=[]; if($s){$q=$db->prepare("SELECT action, ok, detail FROM qbo_sync_audit WHERE tenant_id=:t AND occurred_at>=:c ORDER BY id ASC LIMIT 10");$q->execute(["t"=>(int)$s["tenant_id"],"c"=>$s["created_at"]]);foreach($q->fetchAll(PDO::FETCH_ASSOC) as $r){$trace[]=["action"=>$r["action"],"ok"=>(int)$r["ok"],"detail"=>substr(preg_replace("/[\\r\\n]+/"," ",(string)$r["detail"]),0,500)];}} echo "OAuth trace: ",json_encode($trace,JSON_UNESCAPED_SLASHES),PHP_EOL;'
            php scripts/encryption_key_inventory.php
            if [ "$RECOVERY_MODE" = 'restore' ]; then
              php scripts/validate_data_key.php
              test "$RECOVERY_ESCROW" = "$RECOVERY_DIR/.coreflux-data-key-recovery"
              rm -f -- "$RECOVERY_ESCROW"
              echo 'Data-key recovery escrow removed after verified restore.'
            elif [ "$RECOVERY_MODE" = 'cleanup' ]; then
              php scripts/validate_data_key.php
              test "$RECOVERY_ESCROW" = "$RECOVERY_DIR/.coreflux-data-key-recovery"
              test "$RECOVERY_ARCHIVE" = "$RECOVERY_DIR/pre-key-recovery.tar.gz"
              rm -f -- "$RECOVERY_ESCROW" "$RECOVERY_ARCHIVE"
              rmdir -- "$RECOVERY_DIR"
              echo 'Verified recovery artifacts removed.'
            fi
            echo 'CoreFlux data-key config candidates (paths only):'
            find "$APP_BASE" -maxdepth 6 -type f \( -name 'config.local.php*' -o -name '.env*' -o -name '*.bak' -o -name '*.backup' \) -print0 \
              | while IFS= read -r -d '' candidate; do
                  if grep -q 'COREFLUX_DATA_KEY' "$candidate" 2>/dev/null; then printf '%s\n' "$candidate"; fi
                done
            stat -c 'QBO config file: mode=%a owner=%U group=%G' core/config.local.php
            ps -eo user=,group=,comm= | awk '$3 ~ /^php-fpm/ { print "PHP-FPM process: user=" $1 " group=" $2; exit }' || true
            echo "CoreFlux QuickBooks deploy and worker schedule complete. Cron backup: $CRON_BACKUP"
