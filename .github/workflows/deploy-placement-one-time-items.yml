      - name: Remove only verified temporary release copies
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          script: |
            set -eu
            umask 077
            receipt="/tmp/core-upload-cleanup-${{ github.run_id }}"
            test ! -e "$receipt" && test ! -L "$receipt"
            mkdir -m 700 "$receipt"
            for release in \
              39303643430:1d52f1558c2468b26e0635b053817306276f2ec3 \
              39304118567:3f275c73b0520c9ab656954337e55afa7e4cff9b \
              39313356371:bea5b603f9d5f4c00d7678a4305dc7a3d96d3d5a \
              39314431084:c2b9d27fbe6bbfcdc103569974bab885d301400f \
              39316097948:48694b850a1bc01e9eb7a39c0979e072ba383f23 \
              39317749728:908a7b9d1b21c769f8c725f48de14e211035c616 \
              39522652801:4481d969885131e97958aff081a0c25d4b4ee64e \
              39702452549:4e601ac385abeed76f32cf4150f8ebff351f02fc \
              39528812913:8f68486b1aa0bf82732d52aa62875fb8f0b1430a \
              39531315383:96ecd35d5b4e852a92391b730bbfa4aa1576efe0 \
              39533737236:eac339b7b5eb0abef18994400042674ac0d0e227 \
              39534626249:dcd1b6465190163407184bae5dca3ed660745a44 \
              39527685302:9edaad80bd3e30c137dae404c322b5fe323ae79f \
              39686512795:08c4eadceb94ec8a4c33bf57b469b799cb756c38 \
              39686720751:e9d887e3c2de463213d6ae00d662189abfe1366a \
              39686986781:e3fdb0a6f3db698357084add71b65fec7d3350b7 \
              39484184799:28f766640775054c13ae3612e2a661387a7502fa; do
              run="${release%%:*}"
              expected="${release#*:}"
              upload="/tmp/core-integration-$run"
              if [ ! -e "$upload" ] && [ ! -L "$upload" ]; then continue; fi
              test ! -L "$upload"
              test "$(readlink -f "$upload")" = "$upload"
              test "$(stat -c %u "$upload")" = "$(id -u)"
              test ! -L "$upload/package"
              test "$(readlink -f "$upload/package")" = "$upload/package"
              export CLEANUP_UPLOAD="$upload" CLEANUP_COMMIT="$expected" CLEANUP_RECEIPT="$receipt/$run"
              php <<'PHP'
            <?php
            $upload = getenv('CLEANUP_UPLOAD'); $package = $upload.'/package';
            $entries = array_values(array_diff(scandir($upload), ['.','..'])); sort($entries);
            if ($entries !== ['core-integration-release.sha256','core-integration-release.tar.gz','package']) exit(20);
            foreach ($entries as $entry) if (is_link($upload.'/'.$entry)) exit(21);
            $manifest = $package.'/integration-manifest.json';
            if (is_link($manifest)) exit(22);
            $m = json_decode(file_get_contents($manifest), true, 512, JSON_THROW_ON_ERROR);
            if (($m['product']??'') !== 'full-core-staging' || ($m['commit']??'') !== getenv('CLEANUP_COMMIT') || !is_array($m['files']??null)) exit(23);
            $seen = [];
            foreach (new RecursiveIteratorIterator(new RecursiveDirectoryIterator($package, FilesystemIterator::SKIP_DOTS), RecursiveIteratorIterator::SELF_FIRST) as $item) {
              if ($item->isLink() || $item->getOwner() !== posix_geteuid()) exit(24);
              if ($item->isDir()) continue;
              if (!$item->isFile() || $item->getRealPath() !== $item->getPathname()) exit(25);
              $path = substr($item->getPathname(), strlen($package)+1);
              if ($path === 'integration-manifest.json') continue;
              if (!isset($m['files'][$path]) || !hash_equals($m['files'][$path], hash_file('sha256',$item->getPathname()))) exit(26);
              $seen[$path] = true;
            }
            if (array_diff_key($m['files'],$seen)) exit(27);
            $checksum = file_get_contents($upload.'/core-integration-release.sha256');
            if (!preg_match('/^([a-f0-9]{64})[ *]+core-integration-release\.tar\.gz\s*$/D', $checksum, $match)
              || !hash_equals($match[1], hash_file('sha256',$upload.'/core-integration-release.tar.gz'))) exit(28);
            $receipt = getenv('CLEANUP_RECEIPT');
            if (!copy($manifest, $receipt.'-manifest.json') || !copy($upload.'/core-integration-release.sha256', $receipt.'-archive.sha256')) exit(29);
            echo 'Verified source-only upload ', basename($upload), ' (', count($seen), " files)\n";
            PHP
              du -sh -- "$upload"
              rm -rf -- "$upload"
              printf 'Removed verified temporary upload %s\n' "$run"
            done
            df -h /tmp

  core-integration-staging:
    if: inputs.integration_staging == 'prepare' || inputs.integration_staging == 'deploy' || inputs.integration_staging == 'production_preflight' || inputs.integration_staging == 'production_prepare_settings'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require passing CI for the selected deployment revision
        if: inputs.integration_staging == 'deploy' || inputs.integration_staging == 'production_prepare_settings'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" \
            --jq '.workflow_runs | length' | grep -Eq '^[1-9][0-9]*$'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, json, openssl
          tools: composer:v2
      - name: Build full Core release
        run: |
          git fetch origin main --depth=1
          npm ci --prefix dashboard --no-audit --no-fund
          node --test dashboard/tests/*.test.mjs
          npm run build --prefix dashboard
          node scripts/build_core_integration_release.mjs "$RUNNER_TEMP/core-integration-package"
          tar -czf core-integration-release.tar.gz -C "$RUNNER_TEMP/core-integration-package" .
          sha256sum core-integration-release.tar.gz > core-integration-release.sha256
      - name: Upload private staging package
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          source: core-integration-release.tar.gz,core-integration-release.sha256
          target: /tmp/core-integration-${{ github.run_id }}
      - name: Inspect or install isolated full-Core staging
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          command_timeout: 15m
          script: |
            set -eu
            export COREFLUX_ENV=staging
            export COREFLUX_STAGING_PUBLIC_ORIGIN='https://phpstack-1516771-6707602.cloudwaysapps.com'
            UPLOAD='/tmp/core-integration-${{ github.run_id }}'
            test "$(readlink -f "$UPLOAD")" = "$UPLOAD"
            cd "$UPLOAD"
            sha256sum -c core-integration-release.sha256
            mkdir -m 700 package
            tar -xzf core-integration-release.tar.gz -C package
            if [ '${{ inputs.integration_staging }}' = 'production_prepare_settings' ]; then
              unset COREFLUX_ENV COREFLUX_STAGING_PUBLIC_ORIGIN
              export COREFLUX_PRODUCTION_PREFLIGHT_ROOT='${{ secrets.CW_REMOTE_PATH }}/public_html'
              php package/deploy/prepare_full_core_settings.php --prepare-private-settings
              php package/deploy/verify_full_core_web_settings.php --verify-private-web-settings
              # Private settings stay outside the webroot. The token-protected
              # read-only web probe is removed. No runtime bridge or activation.
              exit 0
            fi
            if [ '${{ inputs.integration_staging }}' = 'production_preflight' ]; then
              unset COREFLUX_ENV COREFLUX_STAGING_PUBLIC_ORIGIN
              export COREFLUX_PRODUCTION_PREFLIGHT_ROOT='${{ secrets.CW_REMOTE_PATH }}/public_html'
              test ! -e "$UPLOAD/production-preflight.json"
              (umask 077; php package/deploy/inspect_full_core_production.php --inspect-production > "$UPLOAD/production-preflight.json")
              cat "$UPLOAD/production-preflight.json"
              # The inspection has no install or migration path. Retain the private
              # package as the exact candidate for review; no production files change.
              exit 0
            fi
            php package/deploy/core_integration_staging.php --inspect
            if [ '${{ inputs.integration_staging }}' != 'deploy' ]; then exit 0; fi
            php package/deploy/core_integration_staging.php --apply
            STAGING_ROOT='/home/1516771.cloudwaysapps.com/muzqvdvqbx/public_html'
            test "$(readlink -f "$STAGING_ROOT")" = "$STAGING_ROOT"
            cd "$STAGING_ROOT"
            OPCACHE_ENDPOINT="$STAGING_ROOT/api/admin/opcache_integration_${{ github.run_id }}.php"
            trap 'rm -f -- "$OPCACHE_ENDPOINT"' EXIT
            OPCACHE_TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
            php -r '$s=file_get_contents($argv[1]); if(substr_count($s,"__COREFLUX_OPCACHE_TOKEN__")!==1)exit(1); file_put_contents($argv[2],str_replace("__COREFLUX_OPCACHE_TOKEN__",$argv[3],$s)); chmod($argv[2],0644);' \
              "$UPLOAD/package/scripts/opcache_flush_deploy.php.template" "$OPCACHE_ENDPOINT" "$OPCACHE_TOKEN"
            curl -fsS --max-time 30 -X POST -H "X-CoreFlux-Deploy-Reset: $OPCACHE_TOKEN" \
              "$COREFLUX_STAGING_PUBLIC_ORIGIN/api/admin/opcache_integration_${{ github.run_id }}.php" \
              | php -r '$r=json_decode(stream_get_contents(STDIN),true); if(($r["ok"]??false)!==true)exit(1); echo "Staging PHP cache refreshed.\n";'
            unset OPCACHE_TOKEN
            rm -f -- "$OPCACHE_ENDPOINT"
            INDEX_SHA="$(sha256sum index.html | cut -d' ' -f1)"
            php deploy/verify_coreaccounting_staging_release.php --expected-index-sha256="$INDEX_SHA"
            php tests/accounting_staging_lifecycle.php --execute
            php tests/accounting_split_receipt_staging.php --execute
            DB_NAME=muzqvdvqbx php tests/accounting_credit_applications_mariadb.php --execute
            php tests/billing_delivery_staging_http.php --execute
            echo 'Full-Core staging acceptance passed for ${{ github.sha }}.'
            # Rollback files and database dumps are retained separately under the SSH home.
            # This directory contains only this run's reproducible upload package.
            cd /tmp
            test ! -L "$UPLOAD"
            test "$(readlink -f "$UPLOAD")" = "/tmp/core-integration-${{ github.run_id }}"
            rm -rf -- "$UPLOAD"
