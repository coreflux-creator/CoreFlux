name: Deploy placement one-time items

on:
  workflow_dispatch:
    inputs:
      integration_staging:
        description: Full-Core staging (prepare inspects; deploy installs the exact CI-passed revision)
        type: choice
        options: [none, inspect, prepare, deploy, maintenance_rehearsal, maintenance_inspect, production_preflight, production_source_audit, production_prepare_settings, cleanup_known_uploads]
        default: none

permissions:
  contents: read
  actions: read

concurrency:
  group: coreflux-cloudways-production
  cancel-in-progress: false

jobs:
  staging-maintenance-rehearsal:
    if: inputs.integration_staging == 'maintenance_rehearsal' || inputs.integration_staging == 'maintenance_inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require passing CI for this rehearsal revision
        if: inputs.integration_staging == 'maintenance_rehearsal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" \
            --jq '.workflow_runs | length' | grep -Eq '^[1-9][0-9]*$'
      - name: Package the two staging-only rehearsal files
        run: |
          tar -czf core-maintenance-rehearsal.tar.gz -C deploy full_core_maintenance.php rehearse_core_staging_maintenance.php
          sha256sum core-maintenance-rehearsal.tar.gz > core-maintenance-rehearsal.sha256
      - name: Upload the private rehearsal package
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          source: core-maintenance-rehearsal.tar.gz,core-maintenance-rehearsal.sha256
          target: /tmp/core-maintenance-${{ github.run_id }}
      - name: Verify Cloudways staging pause and exact restoration
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -eu
            umask 077
            upload='/tmp/core-maintenance-${{ github.run_id }}'
            test ! -L "$upload"
            test "$(readlink -f "$upload")" = "$upload"
            test "$(stat -c %u "$upload")" = "$(id -u)"
            chmod 700 "$upload"
            cd "$upload"
            sha256sum -c core-maintenance-rehearsal.sha256
            mkdir -m 700 package
            tar -xzf core-maintenance-rehearsal.tar.gz -C package
            php -l package/full_core_maintenance.php
            php -l package/rehearse_core_staging_maintenance.php
            if [ '${{ inputs.integration_staging }}' = 'maintenance_inspect' ]; then
              COREFLUX_ENV=staging php package/rehearse_core_staging_maintenance.php --inspect-staging-web
            else
              COREFLUX_ENV=staging php package/rehearse_core_staging_maintenance.php --rehearse-staging-web
            fi

  production-source-audit:
    if: inputs.integration_staging == 'production_source_audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production source fingerprints without file contents
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          script: |
            set -eu
            export COREFLUX_PRODUCTION_PREFLIGHT_ROOT='${{ secrets.CW_REMOTE_PATH }}/public_html'
            php <<'PHP'
            <?php
            $root = getenv('COREFLUX_PRODUCTION_PREFLIGHT_ROOT');
            if (realpath($root) !== $root || basename(dirname($root)) === 'muzqvdvqbx') exit(2);
            $paths = ['core/config.php', 'session.php', 'modules/people/lib/companies.php',
              'modules/placements/lib/economics.php', 'core/migrations/007_subtenant_provisioning.sql',
              'core/migrations/041_csv_mapping_presets.sql', 'core/migrations/043_simulation_harness.sql'];
            $rows = [];
            foreach ($paths as $path) {
              $full = $root.'/'.$path;
              if (is_link($full) || !is_file($full) || !str_starts_with((string)realpath($full), $root.'/')) exit(3);
              $raw = file_get_contents($full);
              if ($raw === false) exit(4);
              $lf = str_replace("\r\n", "\n", $raw);
              $rows[] = ['path'=>$path, 'bytes'=>strlen($raw),
                'git_blob'=>hash('sha1', 'blob '.strlen($raw)."\0".$raw),
                'normalized_git_blob'=>hash('sha1', 'blob '.strlen($lf)."\0".$lf)];
            }
            $metadata = [];
            foreach (['app'=>dirname($root), 'webroot'=>$root, 'private'=>dirname($root).'/private_html',
              'live_config'=>$root.'/core/config.php', 'web_config'=>$root.'/.htaccess', 'db_local'=>$root.'/core/db.local.php',
              'user_ini'=>$root.'/.user.ini'] as $name=>$path) {
              $stat = @stat($path);
              $metadata[$name] = ['exists'=>$stat!==false, 'linked'=>is_link($path),
                'readable'=>is_readable($path), 'writable'=>is_writable($path),
                'uid'=>$stat ? $stat['uid'] : null, 'gid'=>$stat ? $stat['gid'] : null,
                'mode'=>$stat ? decoct($stat['mode'] & 0777) : null,
                'link_count'=>$stat ? $stat['nlink'] : null,
                'inside_webroot'=>$stat ? (realpath($path)===$root || str_starts_with((string)realpath($path),$root.'/')) : null];
            }
            $configured = [];
            $ownerIdentity = ['sudo_available'=>is_executable('/usr/bin/sudo'),'can_act_as_web_file_owner'=>false];
            $ownerAccount=isset($metadata['web_config']['uid']) ? posix_getpwuid($metadata['web_config']['uid']) : false;
            $ownerIdentity['matches_existing_core_application_user']=($ownerAccount['name']??'')==='kunalverma2';
            if ($ownerIdentity['sudo_available'] && isset($metadata['web_config']['uid'])) {
              $identity = proc_open(['/usr/bin/sudo','-n','-u','#'.$metadata['web_config']['uid'],'/usr/bin/id','-u'],
                [0=>['file','/dev/null','r'],1=>['pipe','w'],2=>['file','/dev/null','w']],$identityPipes);
              if (is_resource($identity)) {
                $ownerOutput=trim(stream_get_contents($identityPipes[1])); fclose($identityPipes[1]);
                $ownerExit=proc_close($identity);
                $ownerIdentity['can_act_as_web_file_owner']=$ownerExit===0 && $ownerOutput===(string)$metadata['web_config']['uid'];
                $ownerIdentity['identity_command_exit']=$ownerExit;
              }
            }
            foreach (['DB_HOST','DB_NAME','DB_USER','DB_PASS','COREFLUX_DB_CONFIG_PATH',
              'SMTP_HOST','SMTP_USER','SMTP_PASS','DATA_KEY'] as $key) $configured[$key] = getenv($key)!==false && getenv($key)!=='';
            require_once $root.'/core/db.php';
            $db = getDB();
            if (!$db || $db->query('SELECT DATABASE()')->fetchColumn() !== basename(dirname($root))) exit(5);
            $db->exec('SET TRANSACTION READ ONLY'); $db->beginTransaction();
            try {
              $storage = $db->query("SELECT COALESCE(ENGINE, 'VIEW') AS engine, COUNT(*) AS object_count,
                COALESCE(SUM(DATA_LENGTH),0) AS estimated_data_bytes, COALESCE(SUM(INDEX_LENGTH),0) AS estimated_index_bytes,
                COALESCE(SUM(DATA_LENGTH + INDEX_LENGTH),0) AS estimated_bytes
                FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() GROUP BY ENGINE")->fetchAll(PDO::FETCH_ASSOC);
              $largest = $db->query("SELECT TABLE_NAME AS table_name, TABLE_ROWS AS estimated_rows,
                DATA_LENGTH AS estimated_data_bytes, INDEX_LENGTH AS estimated_index_bytes
                FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE'
                ORDER BY DATA_LENGTH + INDEX_LENGTH DESC LIMIT 8")->fetchAll(PDO::FETCH_ASSOC);
              $active = $db->query("SELECT COMMAND AS command_type, COUNT(*) AS connection_count, MAX(TIME) AS longest_seconds
                FROM information_schema.PROCESSLIST WHERE DB=DATABASE() AND ID<>CONNECTION_ID() GROUP BY COMMAND")->fetchAll(PDO::FETCH_ASSOC);
              $objects = [];
              foreach (['TRIGGERS'=>'TRIGGER_SCHEMA','ROUTINES'=>'ROUTINE_SCHEMA','EVENTS'=>'EVENT_SCHEMA'] as $table=>$column) {
                $objects[strtolower($table)] = (int)$db->query("SELECT COUNT(*) FROM information_schema.$table WHERE $column=DATABASE()")->fetchColumn();
              }
              $counts = [];
              foreach (['people','companies','staffing_clients','ap_vendors_index','placements'] as $table) {
                $counts[$table] = (int)$db->query("SELECT COUNT(*) FROM `$table`")->fetchColumn();
              }
              $history = ['canonical'=>$db->query('SELECT filename, sha256, applied_at, (last_error IS NOT NULL) AS failed FROM _migrations ORDER BY filename')->fetchAll(PDO::FETCH_ASSOC),
                'legacy'=>$db->query('SELECT file_path, checksum_sha, applied_at FROM coreflux_migrations ORDER BY file_path')->fetchAll(PDO::FETCH_ASSOC),
                'deployed'=>[]];
              foreach ($history['canonical'] as $record) {
                $path = str_contains($record['filename'], '/') ? $record['filename'] : 'core/migrations/'.$record['filename'];
                if (!preg_match('~^(core/migrations|modules/[a-zA-Z0-9][a-zA-Z0-9_-]*/migrations)/[a-zA-Z0-9][a-zA-Z0-9_.-]*\.sql$~D', $path)) exit(7);
                $full = $root.'/'.$path;
                if (!is_file($full)) { $history['deployed'][] = ['path'=>$path,'exists'=>false]; continue; }
                if (is_link($full) || !str_starts_with((string)realpath($full),$root.'/')) exit(8);
                $raw = file_get_contents($full); if ($raw === false) exit(9);
                $lf = str_replace("\r\n", "\n", $raw);
                $history['deployed'][] = ['path'=>$path,'exists'=>true,'sha256'=>hash('sha256',$raw),
                  'normalized_sha256'=>hash('sha256',$lf),'normalized_git_blob'=>hash('sha1','blob '.strlen($lf)."\0".$lf)];
              }
              $database = ['storage'=>$storage,'largest_tables'=>$largest,'stored_objects'=>$objects,'active_connections'=>$active,
                'numbering_source_counts'=>$counts,'server_version'=>$db->query('SELECT VERSION()')->fetchColumn()];
            } finally { $db->rollBack(); }
            $cron = proc_open(['crontab','-l'], [0=>['file','/dev/null','r'],1=>['pipe','w'],2=>['pipe','w']], $pipes);
            if (!is_resource($cron)) exit(6);
            $cronText = stream_get_contents($pipes[1]); fclose($pipes[1]);
            stream_get_contents($pipes[2]); fclose($pipes[2]); $cronExit = proc_close($cron);
            $workerPaths = []; $matchingCronLines = 0; $enabledFlags = []; $cronReview = [];
            foreach (preg_split('/\r?\n/', $cronText) as $lineIndex=>$line) {
              $trimmed = ltrim($line);
              if ($trimmed !== '' && !str_starts_with($trimmed,'#') && !preg_match('/^[A-Za-z_][A-Za-z0-9_]*\s*=/', $trimmed)) {
                $cronReview[] = ['line'=>$lineIndex+1,'sha256'=>hash('sha256',$line),'contains_target_root'=>str_contains($line,$root)];
              }
              if (preg_match('/^\s*#/', $line) || !str_contains($line, $root)) continue;
              $matchingCronLines++;
              preg_match_all('~'.preg_quote($root,'~').'/([A-Za-z0-9_./-]+\.php)~', $line, $matches);
              $workerPaths = array_merge($workerPaths, $matches[1]);
              if (preg_match('~\bcd\s+["\x27]?'.preg_quote($root,'~').'["\x27]?\s*&&~', $line)) {
                preg_match_all('~(?:^|\s)((?:cron|scripts)/[A-Za-z0-9_.-]+\.php)\b~', $line, $relativeMatches);
                $workerPaths = array_merge($workerPaths, $relativeMatches[1]);
              }
              foreach (['COREFLUX_QUANTA_METADATA_DELIVERY','COREFLUX_PUREPAY_CORE_LINK_DELIVERY',
                'COREFLUX_PUREPAY_PAYROLL_INPUT_DELIVERY','COREFLUX_PUREPAY_PAYROLL_AUTHORITY','COREFLUX_PUREPAY_PEOPLE_DELIVERY'] as $flag) {
                if (preg_match('/\b'.preg_quote($flag,'/').'=["\x27]?1\b/', $line)) $enabledFlags[] = $flag;
              }
            }
            $temporaryPackages = [];
            foreach (glob('/tmp/core-integration-*', GLOB_ONLYDIR) as $upload) {
              if (!preg_match('~^/tmp/core-integration-[0-9]+$~D', $upload)
                || is_link($upload) || realpath($upload) !== $upload
                || fileowner($upload) !== posix_geteuid()) continue;
              $manifestPath = $upload.'/package/integration-manifest.json';
              $manifest = is_file($manifestPath) && !is_link($manifestPath)
                ? json_decode(file_get_contents($manifestPath), true) : null;
              $du = proc_open(['du','-sk','--',$upload], [0=>['file','/dev/null','r'],1=>['pipe','w'],2=>['file','/dev/null','w']], $duPipes);
              if (!is_resource($du)) exit(10);
              $duText = stream_get_contents($duPipes[1]); fclose($duPipes[1]); $duExit = proc_close($du);
              $entries = [];
              foreach (scandir($upload) as $entry) {
                if ($entry === '.' || $entry === '..') continue;
                $p = $upload.'/'.$entry;
                $entries[] = ['name'=>$entry,'type'=>is_link($p)?'link':(is_dir($p)?'directory':'file')];
              }
              $temporaryPackages[] = ['directory'=>basename($upload), 'entries'=>$entries,
                'allocated_bytes'=>$duExit===0 && preg_match('/^(\d+)\s/', $duText, $duMatch) ? (int)$duMatch[1]*1024 : null,
                'product'=>$manifest['product']??null,'commit'=>$manifest['commit']??null,
                'manifest_sha256'=>is_file($manifestPath)?hash_file('sha256',$manifestPath):null];
            }
            echo json_encode(['mode'=>'read-only-source-fingerprints', 'files'=>$rows,
              'paths'=>$metadata, 'web_owner_identity_check'=>$ownerIdentity, 'environment_configured'=>$configured,
              'database_operations'=>$database,
              'migration_history'=>$history,
              'ssh_user_crontab'=>['readable'=>$cronExit===0,'sha256'=>$cronExit===0?hash('sha256',$cronText):null,
                'active_line_reviews'=>$cronReview,'matching_line_count'=>$matchingCronLines,
                'php_paths'=>array_values(array_unique($workerPaths)),'explicit_enabled_delivery_flags'=>array_values(array_unique($enabledFlags)),
                'app_owner_crontab_verified'=>false],
              'backup_tools'=>['mysqldump'=>is_executable('/usr/bin/mysqldump'),'mariadb_dump'=>is_executable('/usr/bin/mariadb-dump'),
                'private_free_bytes'=>disk_free_space(dirname($root).'/private_html')],
              'temporary_release_packages'=>$temporaryPackages,
              'cli_uid'=>function_exists('posix_geteuid') ? posix_geteuid() : null,
              'cli_gid'=>function_exists('posix_getegid') ? posix_getegid() : null], JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES), "\n";
            PHP

  deploy:
    if: inputs.integration_staging == 'none' || inputs.integration_staging == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Package placement economics release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ENTRY_ASSETS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' index.html | sort -u)
          test "${#ENTRY_ASSETS[@]}" -gt 0
          BUILT_ASSETS=()
          declare -A SEEN_ASSETS=()
          for asset in "${ENTRY_ASSETS[@]}"; do
            if [ -z "${SEEN_ASSETS[$asset]:-}" ]; then
              SEEN_ASSETS[$asset]=1
              BUILT_ASSETS+=("$asset")
            fi
          done
          for ((index = 0; index < ${#BUILT_ASSETS[@]}; index++)); do
            asset="${BUILT_ASSETS[$index]}"
            test -f "spa-assets/$asset"
            if [[ "$asset" == *.js ]]; then
              mapfile -t IMPORTS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' "spa-assets/$asset" | sort -u || true)
              for imported in "${IMPORTS[@]}"; do
                if [ -z "${SEEN_ASSETS[$imported]:-}" ]; then
                  SEEN_ASSETS[$imported]=1
                  BUILT_ASSETS+=("$imported")
                fi
              done
            fi
          done
          ROOT_ASSETS=()
          for asset in "${BUILT_ASSETS[@]}"; do
            test -f "spa-assets/$asset"
            ROOT_ASSETS+=("spa-assets/$asset")
          done
          tar -czf coreflux-placement-items-release.tar.gz \
            .deploy-version \
            core/migrations/139_c2c_source_no_waiver.sql \
            core/migrations/138_placement_one_time_items.sql \
            core/staffing_economics.php \
            core/jobdiva/sync.php \
            dashboard/dist \
            index.html \
            modules/ap/api/bills.php \
            modules/ap/lib/ap.php \
            modules/ap/migrations/019_economic_item_source.sql \
            modules/billing/api/invoices.php \
            modules/billing/lib/billing.php \
            modules/billing/migrations/012_economic_item_source.sql \
            modules/placements/api/cycles.php \
            modules/placements/api/economics.php \
            modules/placements/api/placements.php \
            modules/placements/lib/economics.php \
            modules/people/lib/companies.php \
            modules/placements/ui/PlacementDetail.jsx \
            modules/time/lib/settlement_create.php \
            "${ROOT_ASSETS[@]}" \
            spa-assets/index.html \
            spa-assets/sw.js \
            scripts/opcache_flush_deploy.php.template \
            tests/placement_commercial_contract_smoke.php \
            tests/placement_rate_source_repair_smoke.php \
            tests/placement_one_time_items_smoke.php \
            tests/tenant_staffing_economics_defaults_smoke.php \
            tests/staffing_economics_tenant_scope_smoke.php \
            tests/placement_client_save_smoke.php \
            tests/staffing_economic_graph_smoke.php \
            tests/jobdiva_contract_projection_smoke.php

      - name: Stage placement economics release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          source: coreflux-placement-items-release.tar.gz
          target: /tmp/coreflux-placement-items-${{ github.run_id }}
          overwrite: true

      - name: Publish and verify placement economics release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          command_timeout: 8m
          script: |
            set -eu
            APP_BASE="${{ secrets.CW_REMOTE_PATH }}"
            APP_ROOT="$APP_BASE/public_html"
            STAGE_ROOT="/tmp/coreflux-placement-items-${{ github.run_id }}"
            OPCACHE_TEMPLATE="$APP_ROOT/scripts/opcache_flush_deploy.php.template"
            OPCACHE_ENDPOINT="$APP_ROOT/api/admin/opcache_flush_deploy_${{ github.run_id }}.php"
            OPCACHE_RESPONSE="/tmp/coreflux-placement-items-opcache-${{ github.run_id }}.json"

            test -n "$APP_BASE"
            test "$APP_BASE" != "/"
            test -f "$STAGE_ROOT/coreflux-placement-items-release.tar.gz"
            tar -xzf "$STAGE_ROOT/coreflux-placement-items-release.tar.gz" -C "$STAGE_ROOT"
            rm -f -- "$STAGE_ROOT/coreflux-placement-items-release.tar.gz"
            test -f "$STAGE_ROOT/core/migrations/138_placement_one_time_items.sql"
            test -f "$STAGE_ROOT/core/migrations/139_c2c_source_no_waiver.sql"
            test -f "$STAGE_ROOT/modules/ap/migrations/019_economic_item_source.sql"
            test -f "$STAGE_ROOT/modules/billing/migrations/012_economic_item_source.sql"

            cleanup_deploy() {
              rm -rf -- "$STAGE_ROOT"
              rm -f -- "$OPCACHE_ENDPOINT" "$OPCACHE_RESPONSE" "$OPCACHE_TEMPLATE"
            }
            trap cleanup_deploy EXIT

            cp -R --no-preserve=mode,ownership,timestamps "$STAGE_ROOT"/. "$APP_ROOT"/
            cd "$APP_ROOT"
            SPA_ENTRY="$(sed -n 's#.*src="/\(spa-assets/index-[^"]*\.js\)".*#\1#p' index.html | head -n 1)"
            test -n "$SPA_ENTRY"
            test -f "$SPA_ENTRY"
            grep -Fq 'One-time items' "$SPA_ENTRY"
            grep -Fq 'Margin-only cost' "$SPA_ENTRY"
            grep -Fq 'Payroll earning' "$SPA_ENTRY"
            grep -Fq 'JobDiva says No, so this placement uses 0%' "$SPA_ENTRY"

            php deploy/run_migrations.php
            php deploy/run_migrations.php --status | grep -F 'core/migrations/138_placement_one_time_items.sql'
            php deploy/run_migrations.php --status | grep -F 'core/migrations/139_c2c_source_no_waiver.sql'
            php deploy/run_migrations.php --status | grep -F 'modules/ap/migrations/019_economic_item_source.sql'
            php deploy/run_migrations.php --status | grep -F 'modules/billing/migrations/012_economic_item_source.sql'
            php -r 'require "core/api_bootstrap.php"; $db=getDB(); foreach (["placement_economic_items", "placement_economic_obligations"] as $table) { $q=$db->prepare("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=:name"); $q->execute(["name"=>$table]); if ((int)$q->fetchColumn() !== 1) { fwrite(STDERR, "$table missing\n"); exit(1); } } foreach ([["placement_economic_obligations","source_type"],["billing_invoice_lines","source_type"],["ap_bill_lines","source_type"]] as [$table,$column]) { $q=$db->prepare("SELECT COLUMN_TYPE FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=:table AND column_name=:column"); $q->execute(["table"=>$table,"column"=>$column]); if (!str_contains((string)$q->fetchColumn(), "economic_item")) { fwrite(STDERR, "$table.$column missing economic_item\n"); exit(1); } } echo "Placement one-time item schema verified.\n";'

            php -l modules/placements/lib/economics.php
            php -l core/staffing_economics.php
            php -l core/jobdiva/sync.php
            php -l modules/placements/api/cycles.php
            php -l modules/placements/api/economics.php
            php -l modules/placements/api/placements.php
            php -l modules/people/lib/companies.php
            php -l modules/billing/lib/billing.php
            php -l modules/billing/api/invoices.php
            php -l modules/ap/lib/ap.php
            php -l modules/ap/api/bills.php
            php -l modules/time/lib/settlement_create.php
            php tests/placement_one_time_items_smoke.php
            php tests/placement_commercial_contract_smoke.php
            php tests/placement_rate_source_repair_smoke.php
            php tests/tenant_staffing_economics_defaults_smoke.php
            php tests/staffing_economics_tenant_scope_smoke.php
            php tests/placement_client_save_smoke.php
            php tests/staffing_economic_graph_smoke.php
            php tests/jobdiva_contract_projection_smoke.php

            OPCACHE_TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
            php -r '$template=file_get_contents($argv[1]); if ($template === false || substr_count($template, "__COREFLUX_OPCACHE_TOKEN__") !== 1) exit(1); $content=str_replace("__COREFLUX_OPCACHE_TOKEN__", $argv[3], $template); if (file_put_contents($argv[2], $content, LOCK_EX) === false) exit(1); chmod($argv[2], 0640);' "$OPCACHE_TEMPLATE" "$OPCACHE_ENDPOINT" "$OPCACHE_TOKEN"
            rm -f -- "$OPCACHE_TEMPLATE"
            OPCACHE_STATUS="$(curl -sS --max-time 20 -o "$OPCACHE_RESPONSE" -w '%{http_code}' -X POST -H "X-CoreFlux-Deploy-Reset: $OPCACHE_TOKEN" "https://www.corefluxapp.com/api/admin/opcache_flush_deploy_${{ github.run_id }}.php")"
            unset OPCACHE_TOKEN
            test "$OPCACHE_STATUS" = "200"
            php -r '$r=json_decode((string) file_get_contents($argv[1]), true); if (!is_array($r) || ($r["ok"] ?? false) !== true) exit(1);' "$OPCACHE_RESPONSE"
            echo "Deployed and verified commit ${{ github.sha }}."

  inspect-integration-staging:
    if: inputs.integration_staging == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing isolated staging access
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          script: |
            set -eu
            STAGING_ROOT='/home/1516771.cloudwaysapps.com/muzqvdvqbx/public_html'
            test "$(readlink -f "$STAGING_ROOT")" = "$STAGING_ROOT"
            test -d "$STAGING_ROOT"
            test -r "$STAGING_ROOT/index.html"
            test -w "$STAGING_ROOT"
            printf 'isolated_staging_access=read_write\n'
            df -h "$STAGING_ROOT" /tmp
            df -i "$STAGING_ROOT" /tmp
            find /tmp -maxdepth 1 -type d -user "$(id -un)" -name 'core-integration-*' -print | while IFS= read -r upload; do
              du -sh -- "$upload"
            done
            for path in core/db.local.php core/standalone_env.php private_runtime/vendor/autoload.php .deploy-version; do
              if test -r "$STAGING_ROOT/$path"; then printf 'readable=%s\n' "$path"; fi
            done
            php -v | head -1
            command -v composer || true
            command -v mysqldump || command -v mariadb-dump || true
            cd "$STAGING_ROOT"
            COREFLUX_ENV=staging php <<'PHP'
            <?php
            require 'core/db.php';
            $pdo = getDB();
            if (!$pdo || $pdo->query('SELECT DATABASE()')->fetchColumn() !== 'muzqvdvqbx') exit(2);
            require 'core/mail_bootstrap.php';
            $mail = cf_mail_bootstrap();
            $log = $mail->driver('log');
            $logPath = $log ? $log->log_path() : '';
            echo json_encode(['mail_driver' => $mail->default_driver_name(),
              'mail_log_path' => $logPath,
              'mail_log_exists' => is_file($logPath),
              'mail_log_writable_cli' => is_writable($logPath),
              'mail_log_parent_writable_cli' => is_writable(dirname($logPath))], JSON_UNESCAPED_SLASHES), "\n";
            $attempts = $pdo->query('SELECT i.id AS invoice_id, t.delivery_status, t.delivery_error,
                t.delivery_started_at, t.delivery_finished_at
              FROM billing_invoice_tokens t JOIN billing_invoices i ON i.id=t.invoice_id AND i.tenant_id=t.tenant_id
              WHERE i.tenant_id=999 AND i.notes_internal LIKE "Synthetic staging delivery acceptance %"
              ORDER BY t.id DESC LIMIT 3')->fetchAll(PDO::FETCH_ASSOC);
            echo json_encode(['synthetic_delivery_attempts' => $attempts], JSON_UNESCAPED_SLASHES), "\n";
            $ledger = $pdo->query('SELECT filename, sha256 FROM _migrations ORDER BY filename')->fetchAll(PDO::FETCH_KEY_PAIR);
            echo json_encode([
              'database_identity_verified' => true,
              'simulation_tenant' => (int) $pdo->query('SELECT is_simulation FROM tenants WHERE id=999')->fetchColumn(),
              'migration_count' => count($ledger),
              'root_standalone_rules' => str_contains(file_get_contents('.htaccess'), 'CoreAccounting'),
              'user_ini_present' => is_file('.user.ini'),
              'mail_driver' => defined('MAIL_DRIVER') ? MAIL_DRIVER : getenv('MAIL_DRIVER'),
              'php_environment' => getenv('COREFLUX_ENV'),
            ], JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES), "\n";
            PHP

