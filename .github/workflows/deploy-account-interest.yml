name: Deploy account interest automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreflux-cloudways-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Package accounting release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ENTRY_ASSETS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' index.html | sort -u)
          test "${#ENTRY_ASSETS[@]}" -gt 0
          BUILT_ASSETS=()
          declare -A SEEN_ASSETS=()
          for asset in "${ENTRY_ASSETS[@]}"; do
            if [ -z "${SEEN_ASSETS[$asset]:-}" ]; then
              SEEN_ASSETS[$asset]=1
              BUILT_ASSETS+=("$asset")
            fi
          done
          for ((index = 0; index < ${#BUILT_ASSETS[@]}; index++)); do
            asset="${BUILT_ASSETS[$index]}"
            test -f "spa-assets/$asset"
            if [[ "$asset" == *.js ]]; then
              mapfile -t IMPORTS < <(grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' "spa-assets/$asset" | sort -u || true)
              for imported in "${IMPORTS[@]}"; do
                if [ -z "${SEEN_ASSETS[$imported]:-}" ]; then
                  SEEN_ASSETS[$imported]=1
                  BUILT_ASSETS+=("$imported")
                fi
              done
            fi
          done
          ROOT_ASSETS=()
          for asset in "${BUILT_ASSETS[@]}"; do
            test -f "spa-assets/$asset"
            ROOT_ASSETS+=("spa-assets/$asset")
          done
          tar -czf coreflux-account-interest-release.tar.gz \
            .deploy-version \
            dashboard/dist \
            index.html \
            modules/accounting/api/bank_accounts.php \
            modules/accounting/api/reconciliations.php \
            modules/accounting/lib/account_interest.php \
            modules/accounting/lib/reconciliation_packet.php \
            modules/accounting/manifest.php \
            modules/accounting/migrations/026_bank_account_interest_terms.sql \
            modules/accounting/ui/BankReconciliation.jsx \
            modules/accounting/ui/ReconciliationPacket.jsx \
            "${ROOT_ASSETS[@]}" \
            spa-assets/index.html \
            spa-assets/sw.js \
            scripts/opcache_flush_deploy.php.template \
            tests/accounting_bank_interest_smoke.php

      - name: Stage accounting release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          source: coreflux-account-interest-release.tar.gz
          target: /tmp/coreflux-account-interest-${{ github.run_id }}
          overwrite: true

      - name: Publish and verify accounting release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CW_SSH_HOST }}
          username: ${{ secrets.CW_SSH_USER }}
          key: ${{ secrets.CW_SSH_KEY }}
          port: ${{ secrets.CW_SSH_PORT }}
          command_timeout: 8m
          script: |
            set -eu
            APP_BASE="${{ secrets.CW_REMOTE_PATH }}"
            APP_ROOT="$APP_BASE/public_html"
            STAGE_ROOT="/tmp/coreflux-account-interest-${{ github.run_id }}"
            OPCACHE_TEMPLATE="$APP_ROOT/scripts/opcache_flush_deploy.php.template"
            OPCACHE_ENDPOINT="$APP_ROOT/api/admin/opcache_flush_deploy_${{ github.run_id }}.php"
            OPCACHE_RESPONSE="/tmp/coreflux-account-interest-opcache-${{ github.run_id }}.json"

            test -n "$APP_BASE"
            test "$APP_BASE" != "/"
            test -f "$STAGE_ROOT/coreflux-account-interest-release.tar.gz"
            tar -xzf "$STAGE_ROOT/coreflux-account-interest-release.tar.gz" -C "$STAGE_ROOT"
            rm -f -- "$STAGE_ROOT/coreflux-account-interest-release.tar.gz"
            test -f "$STAGE_ROOT/modules/accounting/migrations/026_bank_account_interest_terms.sql"

            cleanup_deploy() {
              rm -rf -- "$STAGE_ROOT"
              rm -f -- "$OPCACHE_ENDPOINT" "$OPCACHE_RESPONSE"
            }
            trap cleanup_deploy EXIT

            mkdir -p "$APP_ROOT/modules/accounting/migrations"
            cp --no-preserve=mode,ownership,timestamps \
              "$STAGE_ROOT/modules/accounting/migrations/026_bank_account_interest_terms.sql" \
              "$APP_ROOT/modules/accounting/migrations/026_bank_account_interest_terms.sql"
            cd "$APP_ROOT"
            php deploy/run_migrations.php
            php deploy/run_migrations.php --status | grep -F 'modules/accounting/migrations/026_bank_account_interest_terms.sql'

            cp -R --no-preserve=mode,ownership,timestamps "$STAGE_ROOT"/. "$APP_ROOT"/
            SPA_ENTRY="$(sed -n 's#.*src="/\(spa-assets/index-[^"]*\.js\)".*#\1#p' index.html | head -n 1)"
            test -n "$SPA_ENTRY"
            test -f "$SPA_ENTRY"
            grep -Fq 'accounting-interest-terms' "$SPA_ENTRY"
            grep -Fq 'Close and post interest' "$SPA_ENTRY"

            php -l modules/accounting/lib/account_interest.php
            php -l modules/accounting/api/bank_accounts.php
            php -l modules/accounting/api/reconciliations.php
            php -l modules/accounting/lib/reconciliation_packet.php
            php tests/accounting_bank_interest_smoke.php
            php -r 'require "core/api_bootstrap.php"; $db=getDB(); foreach (["accounting_bank_account_terms", "accounting_bank_interest_runs"] as $table) { $q=$db->prepare("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=:name"); $q->execute(["name"=>$table]); if ((int)$q->fetchColumn() !== 1) { fwrite(STDERR, "$table missing\n"); exit(1); } } echo "Interest schema verified.\n";'

            OPCACHE_TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
            php -r '$template=file_get_contents($argv[1]); if ($template === false || substr_count($template, "__COREFLUX_OPCACHE_TOKEN__") !== 1) exit(1); $content=str_replace("__COREFLUX_OPCACHE_TOKEN__", $argv[3], $template); if (file_put_contents($argv[2], $content, LOCK_EX) === false) exit(1); chmod($argv[2], 0640);' "$OPCACHE_TEMPLATE" "$OPCACHE_ENDPOINT" "$OPCACHE_TOKEN"
            OPCACHE_STATUS="$(curl -sS --max-time 20 -o "$OPCACHE_RESPONSE" -w '%{http_code}' -X POST -H "X-CoreFlux-Deploy-Reset: $OPCACHE_TOKEN" "https://www.corefluxapp.com/api/admin/opcache_flush_deploy_${{ github.run_id }}.php")"
            unset OPCACHE_TOKEN
            test "$OPCACHE_STATUS" = "200"
            php -r '$r=json_decode((string) file_get_contents($argv[1]), true); if (!is_array($r) || ($r["ok"] ?? false) !== true) exit(1);' "$OPCACHE_RESPONSE"
            echo "Deployed and verified commit ${{ github.sha }}."
