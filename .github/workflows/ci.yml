name: CoreFlux CI

on:
  push:
    branches: [main, master, develop, codex/coreaccounting-native]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '17 6 * * *'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Smoke suite — 4-way parallel lanes (core / modules / ui / harness).
  # Same test code path; --lane=NAME filters by scripts/ci_lane_classifier.sh.
  # A failure in any lane fails the whole check; lane names tell you
  # where to look at a glance.
  # ─────────────────────────────────────────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    name: Smoke (${{ matrix.lane }})
    strategy:
      fail-fast: false        # let all 4 lanes finish; report all failures
      matrix:
        lane: [core, modules, ui, harness]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, json, openssl
          coverage: none

      - name: Make CI scripts executable
        run: |
          chmod +x scripts/sync_bundle.sh
          chmod +x scripts/ci_smoke_all.sh scripts/ci_sim_scenarios.sh scripts/ci_lane_classifier.sh

      - name: Expose legacy test workspace path
        run: sudo ln -sfn "$GITHUB_WORKSPACE" /app

      - name: Set up Node for GraphQL smoke services
        if: matrix.lane == 'core'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build GraphQL smoke services
        if: matrix.lane == 'core'
        run: |
          for d in subgraph-coreflux subgraph-jobdiva mcp-server; do
            npm ci --prefix "graphql/$d"
            npm run build --prefix "graphql/$d"
          done
          npm ci --prefix graphql/router

      - name: Smoke suite — lane ${{ matrix.lane }}
        run: bash scripts/ci_smoke_all.sh --lane=${{ matrix.lane }}

  # ─────────────────────────────────────────────────────────────────
  # Sim scenario dry-runs — single fast job (~2s total). No reason to
  # parallelize 5 scenarios; they're cheap.
  # ─────────────────────────────────────────────────────────────────
  sim-dry-run:
    runs-on: ubuntu-latest
    name: Sim scenario dry-runs (determinism)

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, json, openssl
          coverage: none

      - name: Make CI scripts executable
        run: chmod +x scripts/ci_sim_scenarios.sh

      - name: Run sim scenario dry-runs (determinism check)
        run: bash scripts/ci_sim_scenarios.sh

  live-business-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Live business graph simulation

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: coreaccounting_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      COREFLUX_ENV: staging
      COREFLUX_ACCOUNTING_DB_CONFIG_PATH: /tmp/coreaccounting-ci-db.php
      SIM_TENANT_ID: 999
      SIM_MODE: 1
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: coreaccounting_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, json, openssl

      - name: Install private CI database config
        run: install -m 600 tests/fixtures/coreaccounting_ci_db.php "$COREFLUX_ACCOUNTING_DB_CONFIG_PATH"

      - name: Bootstrap canonical business graph and seed sim tenant
        run: |
          php deploy/bootstrap_coreaccounting.php --confirm-empty-staging --database=coreaccounting_ci
          php deploy/bootstrap_coreaccounting.php --verify-schema
          php scripts/ci_seed_sim_tenant.php --tenant-only --require-new

      - name: Run full sim execution
        run: bash scripts/ci_sim_full.sh

  coreaccounting-clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: CoreAccounting empty-database install

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: coreaccounting_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      COREFLUX_ENV: staging
      COREFLUX_ACCOUNTING_DB_CONFIG_PATH: /tmp/coreaccounting-ci-db.php
      COREFLUX_STAGING_PUBLIC_ORIGIN: https://staging.corefluxapp.com
      DB_HOST: 127.0.0.1
      DB_NAME: coreaccounting_ci
      DB_USER: root
      DB_PASS: root
      COREFLUX_INITIAL_TENANT_NAME: CoreAccounting CI
      COREFLUX_INITIAL_ADMIN_NAME: CI Administrator
      COREFLUX_INITIAL_ADMIN_EMAIL: ci-admin@coreaccounting.invalid
      COREFLUX_INITIAL_ADMIN_PASSWORD: ci-only-disposable-password-2026
      COREFLUX_INITIAL_ENTITY_LEGAL_NAME: CoreAccounting CI LLC
      COREFLUX_INITIAL_ENTITY_COUNTRY: US
      COREFLUX_INITIAL_ENTITY_BASE_CURRENCY: USD
      COREFLUX_INITIAL_ENTITY_TYPE: llc
      COREFLUX_INITIAL_ACCOUNTING_BASIS: accrual
      COREFLUX_INITIAL_FISCAL_YEAR_START_MONTH: 1
      COREFLUX_INITIAL_FISCAL_YEAR: 2026
      SIM_TENANT_ID: 999

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, json, openssl
          coverage: none

      - name: Install private CI database config
        run: install -m 600 tests/fixtures/coreaccounting_ci_db.php "$COREFLUX_ACCOUNTING_DB_CONFIG_PATH"

      - name: Web request must leave the fresh database empty
        env:
          COREFLUX_STANDALONE_DATABASE: coreaccounting_ci
          COREFLUX_PUBLIC_ORIGIN: https://staging.corefluxapp.com
        run: |
          COREFLUX_ENV=coreaccounting php -S 127.0.0.1:8765 -t . > "$RUNNER_TEMP/coreaccounting-web.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 5 --retry-connrefused --retry-delay 1 --silent --output "$RUNNER_TEMP/coreaccounting-web-response.json" \
            http://127.0.0.1:8765/modules/accounting/api/reports.php
          inspection="$(php deploy/bootstrap_coreaccounting.php --inspect)"
          printf '%s\n' "$inspection"
          printf '%s' "$inspection" | php -r '$result = json_decode(stream_get_contents(STDIN), true); if (($result["database"] ?? null) !== "coreaccounting_ci" || ($result["existing_tables"] ?? -1) !== 0) exit(1);'

      - name: Bootstrap canonical schema and first tenant
        run: |
          php deploy/bootstrap_coreaccounting.php --inspect
          php deploy/bootstrap_coreaccounting.php --confirm-empty-staging --database=coreaccounting_ci
          php deploy/bootstrap_coreaccounting.php --verify-schema
          php deploy/provision_coreaccounting_tenant.php --confirm-first-tenant --database=coreaccounting_ci
          php deploy/audit_coreaccounting_migrations.php --database=coreaccounting_ci
          php scripts/ci_seed_sim_tenant.php --tenant-only --require-new

      - name: Replay invoice, bill, payment and bank scenarios
        run: |
          for pass in 1 2; do
            php sim/runner.php --scenario=ar_invoice_happy_path --seed=42 --tenant=999
            php sim/runner.php --scenario=ap_bill_happy_path --seed=42 --tenant=999
            php sim/runner.php --scenario=ap_payment_canonical_lifecycle --seed=42 --tenant=999
            php sim/runner.php --scenario=treasury_bank_feed_categorize --seed=42 --tenant=999
            php sim/check_accounting_snapshot.php --tenant=999 --entity-code=SIM
          done
